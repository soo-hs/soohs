select{background:#fff;color:var(--tx)}

th{position:sticky;top:0;z-index:3;background:var(--navy-d);color:#fff;cursor:pointer;user-select:none;font-weight:600;padding-right:12px;border-right:1px solid #4a66b8}
th.over{box-shadow:inset 3px 0 var(--amber)}
th.overR{box-shadow:inset -3px 0 var(--amber)}
th .ar{color:var(--amber);margin-left:3px}
th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
th .rz:hover{background:var(--amber)}
th.no,td.no{position:sticky;left:0;text-align:right;cursor:default}
th.no{z-index:5}
td.no{z-index:2;background:var(--navy-l);color:#5a6a9a}
td.yen{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td:not(.no){background:#f8f9fd}
tbody tr:hover td{background:var(--amber-l)!important}
tbody tr{cursor:default}
#msg{padding:24px;text-align:center;color:#5a6a9a}
#panel{display:none;position:fixed;right:10px;z-index:20;background:#fff;color:var(--tx);border:1px solid var(--navy);border-top:3px solid var(--amber);border-radius:6px;box-shadow:0 6px 20px #1f387855;width:270px;max-height:65vh;overflow:auto;padding:6px}

#modal{display:none;position:fixed;inset:0;background:#1f38788a;z-index:30;align-items:center;justify-content:center;padding:14px}

#mb{overflow:auto;padding:4px 14px 14px}

dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:0}

dt{color:#4a5a8a;font-weight:600}
dd{white-space:pre-wrap;word-break:break-all}

function parseCSV(t){
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';out.push(row);row=[]}
    else f+=ch}
  if(f!==''||row.length){row.push(f);out.push(row)}
  return out;
}

    try{const res=await fetch(u,{cache:'no-cache'});if(!res.ok)throw 0;const t=new TextDecoder('utf-8').decode(await res.arrayBuffer());if(!t.includes(KID)||!t.includes('事業所名'))throw 0;text=t;break}catch(e){}
  }
  if(text===null){wrap.innerHTML='<div id="msg">CSVを読み込めませんでした。kyujin.csv を同じフォルダに置くか、ネットワーク接続を確認してください。</div>';return}
  const d=parseCSV(text.replace(/^\uFEFF/,'')).filter(r=>r.some(x=>x!==''));
  const h=d.shift().map(x=>x.trim());
  rows=d.map(a=>{const o={};h.forEach((k,i)=>o[k]=a[i]??'');
    const s=[o['事業所名'],o['住所（所在地）'],o['住所（就業場所）'],...CITY.map(k=>o[k]),o['求人番号'],o[KID],pad(o[KID]),...Object.keys(o).filter(k=>k.startsWith('職業分類')).map(k=>o[k])];
    o._s=norm(s.join('\n'));return o});
  apply();
}
function apply(){
  const terms=norm($('q').value).split(/\s+/).filter(Boolean);
  view=rows.filter(r=>terms.every(t=>r._s.includes(t)));
  const c=BY[sortId];
  if(c){const num=/^-?[\d,]+(\.\d+)?$/;
    view.sort((a,b)=>{const x=c.get(a),y=c.get(b);
      if(x===''&&y!=='')return 1;if(y===''&&x!=='')return -1;
      const r=num.test(x)&&num.test(y)?parseFloat(x.replace(/,/g,''))-parseFloat(y.replace(/,/g,'')):x.localeCompare(y,'ja');
      return r*sortDir})}
  render();
}
/* 伸縮：#と管理Noはpx固定、その他は残り幅を比率配分（最小60%） */
function widths(){
  const av=(wrap.clientWidth||innerWidth)-1,fx=id=>id===KID;let fixed=50,flex=0;
  order.forEach(id=>fx(id)?fixed+=(W[id]||140):flex+=(W[id]||140));
  const k=flex?Math.max(av-fixed,flex*.6)/flex:1;
  return order.map(id=>fx(id)?(W[id]||140):Math.floor((W[id]||140)*k));
}
addEventListener('resize',()=>{if(!fluid)return;const t=wrap.querySelector('table');if(!t)return;
  const px=widths();t.querySelectorAll('col').forEach((c,i)=>c.style.width=(i?px[i-1]:50)+'px');t.style.width=(50+px.reduce((a,b)=>a+b,0))+'px'});
function render(){
  const shown=view.slice(0,limit);
  const w=id=>(W[id]||140);
  const px=fluid?widths():order.map(w),total=px.reduce((a,b)=>a+b,50);
  const cg=`<col style="width:50px">`+px.map(v=>`<col style="width:${v}px">`).join('');
  let h=`<table style="width:${total}px"><colgroup>${cg}</colgroup><thead><tr><th class="no" title="通し番号">#</th>`;
  order.forEach(id=>{h+=`<th draggable="true" data-id="${id}">${esc(BY[id].label)}${sortId===id?`<span class="ar">${sortDir>0?'▲':'▼'}</span>`:''}<span class="rz" draggable="false"></span></th>`});
  h+='</tr></thead><tbody>';
  shown.forEach((r,i)=>{h+=`<tr data-i="${i}"><td class="no">${i+1}</td>`;
    order.forEach(id=>{const c=BY[id],v=disp(c,r);h+=`<td${c.yen?' class="yen"':''} title="${esc(v)}">${esc(v)}</td>`});
    h+='</tr>'});
  h+='</tbody></table>';
  if(!shown.length)h+='<div id="msg">該当する求人がありません</div>';
  wrap.innerHTML=h;wrap._shown=shown;
  $('cnt').innerHTML=`<b>${shown.length.toLocaleString()}</b> / ${rows.length.toLocaleString()} 件`+(view.length!==rows.length?`（該当${view.length.toLocaleString()}）`:'');
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ヘッダー操作：ソート・幅変更・並べ替え */
wrap.addEventListener('click',e=>{
  if(e.target.classList.contains('rz'))return;
  const th=e.target.closest('th[data-id]');if(!th)return;
  const id=th.dataset.id;
  if(sortId===id)sortDir*=-1;else{sortId=id;sortDir=1}
  apply();
});
wrap.addEventListener('mousedown',e=>{
  if(!e.target.classList.contains('rz'))return;
  e.preventDefault();
  const th=e.target.parentNode,id=th.dataset.id,x0=e.clientX;
  const tbl=wrap.querySelector('table'),cols=tbl.querySelectorAll('col'),idx=order.indexOf(id)+1;
  if(fluid){const ths=tbl.querySelectorAll('thead th');order.forEach((k,i)=>{W[k]=ths[i+1].offsetWidth;cols[i+1].style.width=W[k]+'px'});cols[0].style.width='50px';tbl.style.minWidth='0';tbl.style.width=(50+order.reduce((a,k)=>a+W[k],0))+'px';fluid=false}
  const w0=th.offsetWidth,t0=tbl.offsetWidth;
  const mv=ev=>{const nw=Math.max(40,w0+ev.clientX-x0);W[id]=nw;cols[idx].style.width=nw+'px';tbl.style.width=(t0+nw-w0)+'px'};
  const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);wrap._rz=1;setTimeout(()=>wrap._rz=0)};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
});
wrap.addEventListener('click',e=>{if(wrap._rz)e.stopImmediatePropagation()},true);
wrap.addEventListener('dragstart',e=>{const th=e.target.closest&&e.target.closest('th[data-id]');if(!th)return;drag=th.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag)});
wrap.addEventListener('dragover',e=>{const th=e.target.closest('th[data-id]');if(!th||!drag)return;e.preventDefault();wrap.querySelectorAll('th.over,th.overR').forEach(x=>x.classList.remove('over','overR'));th.classList.add(order.indexOf(drag)<order.indexOf(th.dataset.id)?'overR':'over')});
wrap.addEventListener('drop',e=>{
  const th=e.target.closest('th[data-id]');if(!th||!drag)return;e.preventDefault();
  const to=order.indexOf(th.dataset.id),from=order.indexOf(drag);
  if(from>-1&&to>-1&&from!==to){order.splice(from,1);order.splice(to,0,drag)}
  drag=null;render();
});
wrap.addEventListener('dragend',()=>{drag=null;wrap.querySelectorAll('th.over,th.overR').forEach(x=>x.classList.remove('over','overR'))});

/* 検索・表示数 */
let tm;$('q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(apply,120)});
$('lim').addEventListener('change',e=>{limit=+e.target.value;render()});

/* 列追加パネル */
function panel(){
  $('panel').innerHTML=COLS.map(c=>`<label><input type="checkbox" data-id="${c.id}"${order.includes(c.id)?' checked':''}> ${esc(c.label)}</label>`).join('');
}
$('add').addEventListener('click',e=>{
  e.stopPropagation();const p=$('panel');
  if(p.style.display==='block'){p.style.display='none';return}
  panel();p.style.top=(document.querySelector('header').offsetHeight+4)+'px';p.style.display='block';
});
$('panel').addEventListener('click',e=>e.stopPropagation());
$('panel').addEventListener('change',e=>{
  const id=e.target.dataset.id;
  if(e.target.checked){if(!order.includes(id))order.push(id)}else order=order.filter(x=>x!==id);
  render();
});
document.addEventListener('click',()=>$('panel').style.display='none');

/* 詳細モーダル */
const G=[
 ['基本情報',[KID,'求人年度','求人番号','受付安定所','事業所番号','インターネットへの公開','登録方法','元ファイル名','公開日時','最終更新日時','お気に入り登録数']],
 ['事業所',['事業所名 カナ','事業所名','郵便番号（所在地）','住所（所在地）','アクセス（所在地）','代表者名','法人番号','ホームページ','従業員数（企業全体）','従業員数（就業場所）','設立','資本金','事業内容','会社の特長','産業分類','@ind']],
 ['仕事内容・就業場所',['雇用形態','職種','仕事の内容','郵便番号（就業場所）','住所（就業場所）','アクセス（就業場所）',...CITY,'必要な知識・技能等','転勤の可能性','マイカー通勤の可否','入居可能住宅（単身用）','入居可能住宅（世帯用）']],
 ['求人数・募集',['求人数（通勤）','求人数（住込）','求人数（不問）','募集人数','対象学科','エリア']],
 ['給与・労働時間',['基本給','月給（基本給+手当+残業代）','賞与有無（新卒）','時間外労働の有無','時間外労働の月平均時間数','変形労働時間制の種類','休日等','就業時間1','就業時間2','就業時間3','年間休日数']],
 ['応募・見学',['複数応募の受け入れ','複数応募開始の日程','職場見学の受け入れ','職場見学の日程','来校の有無','二次募集の有無','職場見学人数','応募人数','入社人数','卒業生の入社実績']],
 ['担当者',['課係名・役職名（担当者）','氏名（担当者）','氏名カナ（担当者）','電話番号（担当者）','FAX（担当者）','Eメール（担当者）']],
 ['職業分類',MAP.map(m=>m[0]).filter(k=>k.startsWith('職業分類'))],
 ['補足・備考',['補足事項','特記事項','備考','申送り事項','その他の分類']]
];
function openModal(r){
  const used=new Set(G.flatMap(g=>g[1]));
  const rest=COLS.filter(c=>!c.id.startsWith('@')&&!used.has(c.id)).map(c=>c.id);
  const gs=[...G,...(rest.length?[['その他',rest]]:[])];
  $('mt').textContent=`管理No ${pad(r[KID])}　${r['事業所名']||''}`;
  $('mb').innerHTML=gs.map(([t,ks])=>`<h3>${t}</h3><dl>${ks.filter(k=>BY[k]).map(k=>{const c=BY[k];return `<dt>${esc(c.label)}</dt><dd>${esc(disp(c,r))}</dd>`}).join('')}</dl>`).join('');
  $('modal').style.display='flex';$('mb').scrollTop=0;
}
wrap.addEventListener('dblclick',e=>{const tr=e.target.closest('tbody tr');if(tr){getSelection().removeAllRanges();openModal(wrap._shown[+tr.dataset.i])}});
const close=()=>$('modal').style.display='none';
$('mx').onclick=close;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

load();
</script>
