<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付求人票</title>
<style>
:root{--nv:#2f4f8f;--nv2:#4166b0;--nvd:#1f3868;--am:#ffb02e;--am2:#ffe2a8;--bg:#f3f6fc;--tx:#1e2a44;--ln:#d5ddee}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:12px/1.2 "Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;color:var(--tx);background:var(--bg)}
header{background:linear-gradient(var(--nv2),var(--nv));color:#fff;padding:4px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;border-bottom:3px solid var(--am)}
.top{flex:1 1 440px;min-width:0;display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:16px;white-space:nowrap;letter-spacing:.05em}
#q{flex:1;min-width:0;height:24px;border:1px solid var(--am);border-radius:12px;padding:0 12px;font-size:12px}
.ctl{display:flex;align-items:center;gap:10px;margin-left:auto}
select,button,input{font:inherit}
.ctl select{height:24px;border-radius:4px;border:1px solid var(--am)}
#cnt{color:var(--am2);white-space:nowrap}
.addw{position:relative}
button{cursor:pointer}
#addb{height:24px;padding:0 12px;border:0;border-radius:4px;background:var(--am);color:#3b2600;font-weight:700}
.menu{position:absolute;right:0;top:28px;z-index:90;background:#fff;color:var(--tx);border:1px solid var(--nv);border-radius:6px;box-shadow:0 6px 20px #0004;width:260px;max-height:60vh;overflow:auto;padding:4px}
.menu label{display:block;padding:2px 6px;cursor:pointer;white-space:nowrap}.menu label:hover{background:var(--am2)}
#wrap{flex:1;overflow:auto;background:#fff}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%}
th{position:sticky;top:0;z-index:2;background:var(--nvd);color:#fff;text-align:left;padding:3px 6px;height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none;border-right:1px solid #ffffff30}
th.n{left:0;z-index:4;cursor:default;text-align:right}
th.lt{color:#aab8d8}
.rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}.rz:hover{background:var(--am)}
td{padding:2px 6px;height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--ln);border-right:1px solid #eef1f8}
td.n{position:sticky;left:0;background:#eaf0fb;text-align:right;color:var(--nv);z-index:1;font-weight:700}
td.r{text-align:right}td.lt{color:#9aa6c0}
tbody tr:nth-child(even) td{background:#f7f9fe}tbody tr:nth-child(even) td.n{background:#eaf0fb}
tbody tr:hover td{background:var(--am2)}
.ov{position:fixed;inset:0;background:#0a1a3c99;display:flex;align-items:center;justify-content:center}
.ov[hidden]{display:none}
.pn{background:#fff;border-radius:8px;border-top:4px solid var(--am);max-width:96vw;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0007}
.ph{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--nv);color:#fff;border-radius:4px 4px 0 0}
.ph b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:1px solid var(--am);background:none;color:#fff;border-radius:4px;width:28px;height:24px;font-size:16px;line-height:1}
.bt{background:var(--am);color:#3b2600;border:0;border-radius:4px;height:24px;padding:0 12px;font-weight:700}
.pb{overflow:auto;padding:8px 10px}
#md .pn{width:1100px}
.g{margin-bottom:8px;border:1px solid var(--ln);border-radius:6px}
.g h3{margin:0;padding:3px 8px;background:var(--am2);color:#5a3a00;font-size:12px;border-radius:5px 5px 0 0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.kv div{display:grid;grid-template-columns:120px 1fr;gap:6px;padding:3px 8px;border-bottom:1px dotted var(--ln);line-height:1.35}
.kv b{color:var(--nv);font-weight:700}.kv span{white-space:pre-wrap;word-break:break-all}
.kv .lt b,.kv .lt span{color:#9aa6c0}
#adv .pn{width:940px}
.af{padding:6px 12px 10px}
.af h4{margin:6px 0 3px;color:var(--nv);font-size:12px}
.af .row{display:flex;gap:6px}.af input[type=text],.af select{height:24px;border:1px solid #b9c5e0;border-radius:4px;padding:0 6px}
.af input[type=text]{flex:1;min-width:0}
.ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px 8px}
.ck label{white-space:nowrap}
.bc{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.bc>b{background:#e8eef9;padding:4px 6px;color:var(--nv);border-bottom:1px solid #fff}.bc>div{padding:3px 8px;border-bottom:1px solid var(--ln)}
.fb{display:flex;justify-content:flex-end;gap:8px;padding:6px 12px;border-top:1px solid var(--ln)}
.fb button{height:26px;padding:0 16px;border-radius:4px;border:1px solid var(--nv);background:#fff;color:var(--nv)}
.fb .go{background:var(--am);border-color:var(--am);color:#3b2600;font-weight:700}
#sm .pn{width:1500px;height:92vh}
.st{width:100%;border-collapse:collapse;table-layout:auto}
.st th{cursor:default;font-size:11px}.st td{white-space:normal;height:auto;padding:3px 6px;vertical-align:top;overflow:visible}
.bar{height:8px;background:#e1e8f6;border-radius:4px;width:70px;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--am);border-radius:4px}
.ok,.ng{display:inline-block;padding:0 5px;margin:1px;border-radius:8px;font-size:10px;white-space:nowrap}
.ok{background:#dbe7ff;color:var(--nvd)}.ng{background:#ffe3d6;color:#9a3d10}
.ref{background:var(--am2);padding:4px 10px;margin-bottom:6px;border-radius:4px}
@media(max-width:700px){.kv{grid-template-columns:1fr}}
</style></head><body>
<header>
<div class="top"><h1>受付求人票</h1><input id="q" type="search" placeholder="事業所名/所在地/就業場所/求人番号/管理No/職業分類（ダブルクリックで詳細検索）"></div>
<div class="ctl"><label>年度 <select id="yr"><option value="">すべて</select></label><label>表示数 <select id="ps"><option>50<option selected>100<option>300<option>400<option>500</select></label><span id="cnt"></span>
<div class="addw"><button id="addb">＋列追加</button><div id="addm" class="menu" hidden></div></div></div>
</header>
<main id="wrap"><table id="t"><colgroup></colgroup><thead></thead><tbody></tbody></table></main>
<div id="adv" class="ov" hidden><div class="pn"><div class="ph"><b>詳細検索</b><button class="x" id="advx">×</button></div><div class="pb af" id="advb"></div><div class="fb"><button id="advc">クリア</button><button class="go" id="advg">検索</button></div></div></div>
<div id="md" class="ov" hidden><div class="pn"><div class="ph"><b id="mdt"></b><button class="bt" id="mds">類似求人検索（上位50件）</button><button class="x" id="mdx">×</button></div><div class="pb" id="mdb"></div></div></div>
<div id="sm" class="ov" hidden><div class="pn"><div class="ph"><b id="smt"></b><button class="x" id="smx">×</button></div><div class="pb" id="smb"></div></div></div>
<script>
const BASE='https://soo-hs.github.io/soohs/kyujin/';
const RN=`
'求人年度'→'年度','求人番号'→'求人番号','受付安定所'→'受付所','事業所番号'→'事業所No','インターネットへの公開'→'WEB公開','事業所名 カナ'→'事業所カナ','事業所名'→'事業所名','郵便番号（所在地）'→'所在_郵便No','住所（所在地）'→'所在地住所','アクセス（所在地）'→'所在地アクセス','代表者名'→'代表者','法人番号'→'法人No','ホームページ'→'web_site','従業員数（企業全体）'→'全社員数','従業員数（就業場所）'→'就業社員数','設立'→'設立年','資本金'→'資本金','事業内容'→'事業内容','会社の特長'→'会社特長','雇用形態'→'雇用形態','職種'→'職種','仕事の内容'→'仕事内容','郵便番号（就業場所）'→'就業_郵便No','住所（就業場所）'→'就業場所住所','アクセス（就業場所）'→'就業場所アクセス','求人数（通勤）'→'通勤求人','求人数（住込）'→'住込求人','求人数（不問）'→'不問求人','必要な知識・技能等'→'必要スキル','転勤の可能性'→'転勤','マイカー通勤の可否'→'マイカー通勤','入居可能住宅（単身用）'→'単身住宅','入居可能住宅（世帯用）'→'世帯住宅','基本給'→'基本給','月給（基本給+手当+残業代）'→'月給','賞与有無（新卒）'→'賞与','時間外労働の有無'→'残業の有無','時間外労働の月平均時間数'→'平均残業時間','変形労働時間制の種類'→'労働時間の種類','休日等'→'休日','就業時間1'→'就業時間1','就業時間2'→'就業時間2','就業時間3'→'就業時間3','年間休日数'→'年間休日','複数応募の受け入れ'→'複数応募','複数応募開始の日程'→'複数応募日程','職場見学の受け入れ'→'職場見学','職場見学の日程'→'見学日程','課係名・役職名（担当者）'→'担当役職','氏名（担当者）'→'担当者','氏名カナ（担当者）'→'担当者カナ','電話番号（担当者）'→'担当TEL','FAX（担当者）'→'担当FAX','Eメール（担当者）'→'担当メール','補足事項'→'補足','特記事項'→'特記','産業分類'→'産業分類NO','職業分類（3桁）'→'職業分類1','職業分類（5桁）'→'職業分類1','職業分類2（3桁）'→'職業分類2','職業分類2（5桁）'→'職業分類2','就業場所住所（市区町村）'→'就業_市区町村1','就業場所住所2（市区町村）'→'就業_市区町村2','就業場所住所3（市区町村）'→'就業_市区町村3','管理番号'→'管理No','対象学科'→'対象学科','エリア'→'エリア','卒業生の入社実績'→'入社実績','その他の分類'→'その他分類','募集人数'→'募集人数','来校の有無'→'来校','二次募集の有無'→'二次募集','職場見学人数'→'見学人数','応募人数'→'応募人数','入社人数'→'入社人数','備考'→'備考','申送り事項'→'申送り事項','公開日時'→'公開日時','最終更新日時'→'更新日時','登録方法'→'登録方法','元ファイル名'→'元ファイル','職業分類（ハローワーク）大分類'→'HW職業大分類','職業分類（ハローワーク）中分類'→'HW職業中分類','職業分類（ハローワーク）小分類'→'HW職業小分類','職業分類（handy）大分類'→'handy職業大分類','職業分類（handy）中分類'→'handy職業中分類','職業分類2（ハローワーク）大分類'→'HW職業2大分類','職業分類2（ハローワーク）中分類'→'HW職業2中分類','職業分類2（ハローワーク）小分類'→'HW職業2小分類','職業分類2（handy）大分類'→'handy職業2大分類','職業分類2（handy）中分類'→'handy職業2中分類','お気に入り登録数'→'お気に入り数','職業分類コード（日本標準職業分類への変換）'→'標準職業1コード','職業分類（日本標準職業分類への変換）'→'標準職業分類1','職業分類2コード（日本標準職業分類への変換）'→'標準職業2コード','職業分類2（日本標準職業分類への変換）'→'標準職業分類2'`
.trim().split(/,(?=')/).map(l=>l.trim().split('→').map(s=>s.replace(/^'|'$/g,'')));
const MAP={};RN.forEach(([a,b])=>MAP[a]=b);
let ALL=[...new Set(RN.map(x=>x[1]))];
ALL.splice(ALL.indexOf('産業分類NO')+1,0,'産業分類名');
ALL.splice(ALL.indexOf('年間休日')+1,0,'時間あたりの賃金','予想月給','予想賞与');
ALL.push('就業場所','求人数計','職業分類');
const LBL={求人数計:'求人数(計)'};
const MONEY=new Set(['基本給','月給','時間あたりの賃金','予想月給','予想賞与']);
const LT=new Set(['時間あたりの賃金','予想月給','予想賞与','産業分類名']);
const W={事業所名:200,所在地住所:230,就業場所:150,職業分類:210,資本金:90,管理No:70,全社員数:70,就業社員数:70,求人数計:70,月給:90,年間休日:70,賞与:60,求人番号:110,WEB公開:70,来校:50,仕事内容:260,事業内容:260};
const DEF=['管理No','事業所名','所在地住所','全社員数','就業社員数','資本金','就業場所','求人数計','職業分類','月給','年間休日','賞与','求人番号','WEB公開','来校'];
const GR=[['基本情報','年度 求人番号 管理No 受付所 事業所No WEB公開 公開日時 更新日時 登録方法 元ファイル お気に入り数'],['事業所','事業所名 事業所カナ 所在_郵便No 所在地住所 所在地アクセス 代表者 法人No web_site 全社員数 就業社員数 設立年 資本金 事業内容 会社特長 産業分類NO 産業分類名'],['仕事内容・就業場所','雇用形態 職種 仕事内容 就業_郵便No 就業場所住所 就業場所アクセス 就業_市区町村1 就業_市区町村2 就業_市区町村3 通勤求人 住込求人 不問求人 求人数計 必要スキル 転勤 マイカー通勤 単身住宅 世帯住宅'],['給与・労働時間','基本給 月給 賞与 残業の有無 平均残業時間 労働時間の種類 休日 就業時間1 就業時間2 就業時間3 年間休日 時間あたりの賃金 予想月給 予想賞与'],['応募・見学','複数応募 複数応募日程 職場見学 見学日程 募集人数 来校 二次募集 見学人数 応募人数 入社人数 入社実績'],['担当者','担当役職 担当者 担当者カナ 担当TEL 担当FAX 担当メール'],['職業分類','職業分類 職業分類1 職業分類2 HW職業大分類 HW職業中分類 HW職業小分類 handy職業大分類 handy職業中分類 HW職業2大分類 HW職業2中分類 HW職業2小分類 handy職業2大分類 handy職業2中分類 標準職業1コード 標準職業分類1 標準職業2コード 標準職業分類2'],['その他','補足 特記 備考 申送り事項 対象学科 エリア その他分類']].map(([n,s])=>[n,s.split(' ')]);
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFKC').toLowerCase();
const num=v=>{const n=parseFloat(String(v??'').normalize('NFKC').replace(/[^\d.\-]/g,''));return isNaN(n)?NaN:n};
const fm=v=>{if(v===''||v==null)return'';const n=typeof v==='number'?v:num(v);return isNaN(n)?String(v):'¥'+Math.round(n).toLocaleString()};
const show=(r,k)=>MONEY.has(k)?fm(r[k]):String(r[k]??'');
let data=[],IND={},vis=[...DEF],filt=[],sort=[['年度','d'],['管理No','d']],Wd={},adv=null,Z=100;
ALL.forEach(k=>Wd[k]=W[k]||100);
function parseCSV(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==',')r.push(f),f='';else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}if(f!==''||r.length){r.push(f);R.push(r)}return R}
async function buf(n){for(const u of[n,BASE+n]){try{const r=await fetch(u);if(r.ok)return await r.arrayBuffer()}catch(e){}}return null}
const dec=b=>{let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('shift_jis').decode(b)}return t.replace(/^\uFEFF/,'')};
async function init(){
 const [bi,bk]=await Promise.all([buf('産業分類.txt'),buf('kyujin2026.csv')]);
 if(bi)dec(bi).split(/\r?\n/).slice(1).forEach(l=>{const i=l.indexOf(',');if(i>0)IND[l.slice(0,i).trim()]=l.slice(i+1).replace(/^,/,'').trim()});
 if(!bk){$('cnt').textContent='kyujin2026.csv を読み込めません';return}
 const R=parseCSV(dec(bk)),hd=R[0].map(h=>MAP[h.trim()]);
 data=R.slice(1).filter(r=>r.some(x=>x&&x.trim())).map(r=>{
  const o={};hd.forEach((k,j)=>{if(!k)return;const v=(r[j]||'').trim();if(!(k in o)||(!o[k]&&v))o[k]=v});
  ALL.forEach(k=>{if(!(k in o))o[k]=''});
  if(o.管理No)o.管理No=o.管理No.padStart(4,'0');
  const d=o.産業分類NO.replace(/\D/g,'');o.産業分類名=d?(IND[d]||IND[d.padStart(3,'0')]||IND[d.slice(0,3)]||''):'';
  o.就業場所=[1,2,3].map(i=>o['就業_市区町村'+i]).filter(Boolean).join(' / ');
  o.求人数計=(num(o.通勤求人)||0)+(num(o.住込求人)||0)+(num(o.不問求人)||0);
  o.職業分類=[o.標準職業分類1,o.標準職業分類2].filter(Boolean).join(' / ');
  const m=num(o.月給),h=(365-num(o.年間休日))*8/12;
  if(m>0&&h>0){const w=m/h;o.時間あたりの賃金=Math.round(w);o.予想月給=Math.round(m+w*(num(o.平均残業時間)||0)*1.25)}
  if(/あり/.test(o.賞与)&&num(o.基本給)>0)o.予想賞与=num(o.基本給)*2;
  o._s=norm([o.事業所名,o.所在地住所,o.就業場所住所,o.就業場所,o.求人番号,o.管理No,o.職業分類,o.職種].join(' '));
  return o});
 const ys=[...new Set(data.map(r=>r.年度).filter(Boolean))].sort((a,b)=>b.localeCompare(a,'ja',{numeric:true}));
 $('yr').innerHTML='<option value="">すべて</option>'+ys.map(y=>`<option>${esc(y)}</option>`).join('');
 if(ys.length)$('yr').value=ys[0];
 render();
}
const cmpv=(a,b)=>{const x=a===''?-Infinity:a,y=b===''?-Infinity:b;const nx=typeof x==='number'||(x!==''&&!isNaN(+x)),ny=typeof y==='number'||(y!==''&&!isNaN(+y));if(nx&&ny)return(+x)-(+y);return String(a).localeCompare(String(b),'ja')};
function render(){
 const terms=norm($('q').value).split(/\s+/).filter(Boolean);
 const yv=$('yr').value;
 filt=data.filter(r=>(!yv||r.年度===yv)&&terms.every(t=>r._s.includes(t))&&(!adv||adv(r)));
 filt.sort((a,b)=>{for(const[k,d]of sort){const c=cmpv(a[k],b[k]);if(c)return d=='a'?c:-c}return 0});
 const sh=filt.slice(0,Z);
 $('cnt').textContent=`${sh.length.toLocaleString()} / ${filt.length.toLocaleString()} 件`+(filt.length<data.length?`（全${data.length.toLocaleString()}件）`:'')+(adv?' ★詳細検索中':'');
 $('t').querySelector('colgroup').innerHTML='<col style="width:42px">'+vis.map(k=>`<col style="width:${Wd[k]}px">`).join('');

function sim(a,b){let sc=0,mx=0;const ok=[],ng=[];
 const t=(w,l,x,y,f)=>{const m=v=>v===''||v==null||(typeof v=='number'&&isNaN(v));if(m(x)||m(y))return;const s=Math.max(0,f(x,y));mx+=w;sc+=w*s;(s>=.6?ok:ng).push(l+(s<1&&s>=.6?'(近)':''))};
 const eq=(x,y)=>x==y?1:0;
 const ind=r=>{const d=r.産業分類NO.replace(/\D/g,'');return d?d.padStart(3,'0'):''};
 t(15,'産業分類',ind(a),ind(b),(x,y)=>x==y?1:x.slice(0,2)==y.slice(0,2)?.6:0);
 t(20,'職業分類',a.標準職業1コード,b.標準職業1コード,(x,y)=>x==y?1:x.slice(0,3)==y.slice(0,3)?.7:x.slice(0,2)==y.slice(0,2)?.3:0);

 t(8,'雇用形態',a.雇用形態,b.雇用形態,eq);
 t(10,'月給',num(a.月給),num(b.月給),(x,y)=>1-Math.abs(x-y)/Math.max(x,y)*4);
 t(6,'年間休日',num(a.年間休日),num(b.年間休日),(x,y)=>1-Math.abs(x-y)/30);
 t(5,'賞与',a.賞与,b.賞与,eq);t(4,'転勤',a.転勤,b.転勤,eq);t(3,'マイカー通勤',a.マイカー通勤,b.マイカー通勤,eq);t(3,'残業有無',a.残業の有無,b.残業の有無,eq);t(3,'勤務制度',a.労働時間の種類,b.労働時間の種類,eq);
 return{p:mx?sc/mx*100*Math.min(1,mx/50):0,ok,ng,n:mx}}

const HR=[['99日以下',0,99],['100日 - 109日',100,109],['110日 - 119日',110,119],['120日 - 129日',120,129],['130日以上',130,999]];
const DY=[['月曜','月'],['火曜','火'],['水曜','水'],['木曜','木'],['金曜','金'],['土曜','土'],['日曜','日'],['祝日','祝'],['その他','他']];
const WS=[['交替制（シフト制）',/交替|シフト/],['裁量労働制',/裁量/],['フレックスタイム制',/フレックス/],['変形労働時間制',/変形/],['上記のような特別な勤務制度ではない',null]];

$('advg').onclick=()=>{
 const fs=$('fs').value,fw=norm($('fw').value).split(/\s+/).filter(Boolean),fa=norm($('fa').value).split('/').map(s=>s.trim()).filter(Boolean);
 const jt=chk('jt'),mr=chk('mr'),dy=chk('dy'),hr=chk('hr'),tk=chk('tk').length,jy=chk('jy'),ws=chk('ws'),bo=rv('bo'),ot=rv('ot'),oh=num($('oh').value),JK=Object.keys(JT);
 adv=r=>{
  if(fw.length){const s=norm((fs?[fs]:['事業所名','職種','仕事内容','事業内容','管理No','求人番号']).map(k=>r[k]).join(' '));if(!fw.every(t=>s.includes(t)))return false}
  if(fa.length){const s=norm(r.就業場所住所+' '+r.就業場所);if(!fa.some(t=>s.includes(t)))return false}
  if(jt.length){const s=r.職業分類+r.HW職業大分類+r.HW職業中分類+r.職種+r.handy職業大分類;if(!jt.some(i=>i<JK.length?JT[JK[i]].test(s):!JK.some(k=>JT[k].test(s))))return false}
  if(mr.length){const m=num(r.月給);if(isNaN(m)||!mr.some(i=>m>=MR[i][1]&&m<=MR[i][2]))return false}
  if(bo&&!(bo=='あり'?/あり/.test(r.賞与):/なし|無/.test(r.賞与)))return false
  if(dy.length&&!dy.every(i=>DY[i][1]=='他'?/他|不定|シフト|交替|変形/.test(r.休日):r.休日.includes(DY[i][1])))return false
  if(hr.length){const h=num(r.年間休日);if(isNaN(h)||!hr.some(i=>h>=HR[i][1]&&h<=HR[i][2]))return false}
  if(tk&&!/なし|無|転勤.*ない/.test(r.転勤))return false
  if(jy.some(i=>{const v=i?r.世帯住宅:r.単身住宅;return !v||/なし|無|不可/.test(v)}))return false
  if(ot=='あり'){if(!/あり|有/.test(r.残業の有無))return false;if(!isNaN(oh)){const h=num(r.平均残業時間);if(!isNaN(h)&&h>oh)return false}}
  if(ot=='なし'&&!/なし|無/.test(r.残業の有無))return false
  if(ws.length&&!ws.some(i=>WS[i][1]?WS[i][1].test(r.労働時間の種類):(!r.労働時間の種類||/なし|無|該当/.test(r.労働時間の種類))))return false
  return true};
