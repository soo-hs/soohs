const GS={'求人年度':'基本情報','事業所名 カナ':'事業所情報','雇用形態':'求人内容','郵便番号（就業場所）':'就業場所','求人数（通勤）':'求人条件','基本給':'給与・労働時間','複数応募の受け入れ':'応募・見学','課係名・役職名（担当者）':'担当者','補足事項':'補足・特記','産業分類':'分類','管理番号':'管理・その他'};
// 列定義
const labelCnt={};let cols=[];let grp='';
RENAME.forEach(([o,s])=>{if(GS[o])grp=GS[o];let l=s;if(labelCnt[s]){const m=o.match(/（(\d桁)）/);l=s+(m?'('+m[1]+')':'2')}labelCnt[s]=1;
 if(/（3桁）|（5桁）/.test(o)&&!/2/.test(s)){}cols.push({id:o,label:l,g:grp});
 if(o==='産業分類')cols.push({id:'v_sg',label:'産業分類名',g:grp,faint:1});
 if(o==='年間休日数')cols.push({id:'v_hr',label:'時間あたりの賃金',g:grp,faint:1,n:1},{id:'v_pm',label:'予想月給',g:grp,faint:1,n:1},{id:'v_pb',label:'予想賞与',g:grp,faint:1,n:1})});
// 重複ラベル(職業分類1 3桁/5桁)対応: 最初の出現にも桁を付与
cols.forEach(c=>{const m=c.id.match(/^(職業分類2?)（(\d桁)）/);if(m)c.label=(m[1]==='職業分類'?'職業分類1':'職業分類2')+'('+m[2]+')'});
const combo=[{id:'v_area',label:'就業場所(市区町村)',n:0},{id:'v_cnt',label:'求人数(計)',n:1},{id:'v_occ',label:'職業分類(標準)',n:0}];
const ALL=[...cols,...combo.map(c=>({...c,g:'_'}))];const byId=Object.fromEntries(ALL.map(c=>[c.id,c]));
const ID={no:'管理番号',nm:'事業所名',kyu:'月給',base:'基本給',hol:'年間休日数',ot:'時間外労働の月平均時間数',bonus:'賞与有無（新卒）'};
const R=n=>RENAME.find(r=>r[1]===n)[0];
const K={no:R('管理No'),nm:R('事業所名'),adr:R('所在地住所'),emp:R('全社員数'),emp2:R('就業社員数'),cap:R('資本金'),kyu:R('月給'),base:R('基本給'),hol:R('年間休日'),ot:R('平均残業時間'),bn:R('賞与'),jn:R('求人番号'),web:R('WEB公開'),vis:R('来校'),yr:R('年度'),sg:R('産業分類NO'),corp:R('法人No'),oc:R('標準職業分類1'),oc2:R('標準職業分類2'),c1:R('通勤求人'),c2:R('住込求人'),c3:R('不問求人'),m1:R('就業_市区町村1'),m2:R('就業_市区町村2'),m3:R('就業_市区町村3'),work:R('就業場所住所'),shk:R('職種'),job:R('仕事内容'),biz:R('事業内容'),tn:R('転勤'),s1:R('単身住宅'),s2:R('世帯住宅'),otf:R('残業の有無'),wt:R('労働時間の種類'),rest:R('休日')};
let vis=[K.no,K.nm,K.adr,K.emp,K.emp2,K.cap,'v_area','v_cnt','v_occ',K.kyu,K.hol,K.bn,K.jn,K.web,K.vis];
const W={};let sort=[{id:K.yr,d:-1},{id:K.no,d:-1}];let rows=[],view=[];
const num=s=>{const v=parseFloat(String(s==null?'':s).replace(/[,，円\s]/g,''));return isFinite(v)?v:NaN};
const nz=s=>String(s||'').normalize('NFKC');
// CSV
function parse(t){const o=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')o.push(r);r=[]}else f+=c}if(f!==''||r.length){r.push(f);o.push(r)}return o}
async function load(){const urls=['kyujin2026.csv','https://soo-hs.github.io/soohs/kyujin/kyujin2026.csv'];let buf;
 for(const u of urls){try{const r=await fetch(u);if(r.ok){buf=await r.arrayBuffer();break}}catch(e){}}
 if(!buf){$('#cnt').textContent='CSV読込失敗';return}
 let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(buf);t=t.replace(/^\ufeff/,'');
 const p=parse(t),h=p[0].map(s=>s.trim());rows=p.slice(1).map(a=>{const o={};h.forEach((k,i)=>o[k]=(a[i]||'').trim());return derive(o)});run()}
function sgName(c){c=String(c||'').trim();if(!c)return'';const d=c.replace(/\D/g,'');if(!d)return'';let k=d.length<=3?d.padStart(3,'0'):d;return SANGYO[k]||SANGYO[d.slice(0,3)]||''}
function derive(r){r.v_sg=sgName(r[K.sg]);r.v_area=[r[K.m1],r[K.m2],r[K.m3]].filter(Boolean).join('・');
 const c=[K.c1,K.c2,K.c3].map(k=>num(r[k])).filter(v=>!isNaN(v));r.v_cnt=c.length?String(c.reduce((a,b)=>a+b,0)):'';r.v_occ=[r[K.oc],r[K.oc2]].filter(Boolean).join('・');
 const kyu=num(r[K.kyu]),h=num(r[K.hol]),ot=num(r[K.ot])||0;r.v_hr=r.v_pm=r.v_pb='';
 if(!isNaN(kyu)&&!isNaN(h)){const hrs=(365-h)*8/12,hw=kyu/hrs;r.v_hr=String(Math.round(hw));r.v_pm=String(Math.round(kyu+hw*ot*1.25))}
 if(String(r[K.bn]).startsWith('あり')){const b=num(r[K.base]);if(!isNaN(b))r.v_pb=String(b*2)}
 r._s=nz([r[K.nm],r[K.adr],r[K.work],r.v_area,r[K.jn],r[K.no],String(num(r[K.no])),...Object.keys(r).filter(k=>k.includes('職業分類')).map(k=>r[k])].join('\u0001')).toLowerCase();return r}
// 検索
const mt=(q,t)=>{q=nz(q).toLowerCase().trim();if(!q)return true;t=nz(t).toLowerCase();return q.split('/').some(g=>{const w=g.trim().split(/\s+/).filter(Boolean);return w.length&&w.every(x=>t.includes(x))})};
const chk=n=>[...document.querySelectorAll(`#gc input[name=${n}]:checked`)].map(e=>e.value);
const RNG={kyu:[[0,149999],[150000,174999],[175000,199999],[200000,249999],[250000,1e12]],hol:[[0,99],[100,109],[110,119],[120,129],[130,1e4]]};
const DAYS=['月','火','水','木','金','土','日','祝','その他'];
function ok(r){if(!mt($('#q').value,r._s))return false;
 const fk=$('#fk').value,fw=$('#fw').value;if(fw){const t=fk?r[fk]:Object.values(r).join(' ');if(!mt(fw,t))return false}
 const kn=$('#kn').value;if(kn){const g=nz(kn).split('/').map(s=>s.trim()).filter(Boolean);if(!g.some(s=>nz(r[K.jn]).includes(s)||nz(r[K.no]).includes(s)||(!isNaN(num(s))&&num(r[K.no])===num(s))))return false}
 if(!mt($('#ad').value,[r[K.work],r.v_area].join(' ')))return false;
 for(const n of['kyu','hol']){const s=chk(n);if(s.length){const v=num(r[n=='kyu'?K.kyu:K.hol]);if(isNaN(v)||!s.some(i=>v>=RNG[n][i][0]&&v<=RNG[n][i][1]))return false}}
 const rb=n=>{const e=document.querySelector(`#gc input[name=${n}]:checked`);return e?e.value:''};
 const b=rb('bn');if(b==='あり'&&!String(r[K.bn]).startsWith('あり'))return false;if(b==='なし'&&String(r[K.bn]).startsWith('あり'))return false;
 const d=chk('day');if(d.length&&!d.some(i=>String(r[K.rest]).includes(DAYS[i])))return false;
 if(chk('tn').length&&!String(r[K.tn]).includes('なし'))return false;
 const hs=chk('hs');if(hs.length&&!hs.some(i=>{const v=String(r[i=='0'?K.s1:K.s2]);return v&&!/なし|不可/.test(v)}))return false;
 const o=rb('ot');if(o==='あり'){if(!String(r[K.otf]).includes('あり'))return false;const m=num($('#otm').value);if(!isNaN(m)&&(num(r[K.ot])||0)>m)return false}
 if(o==='なし'&&!String(r[K.otf]).includes('なし'))return false;
 const w=chk('wt');if(w.length){const v=String(r[K.wt]);const T=['交替','裁量','フレックス','変形'];if(!w.some(i=>i==4?(!v||/なし/.test(v)):v.includes(T[i])))return false}
 return true}
function cmp(a,b){for(const s of sort){let x=a[s.id]||'',y=b[s.id]||'';const nx=num(x),ny=num(y);let c=(!isNaN(nx)&&!isNaN(ny)&&!/[^\d.,\-\s年度]/.test(x+y))?nx-ny:String(x).localeCompare(String(y),'ja');if(c)return c*s.d}return 0}
function run(){view=rows.filter(ok).sort(cmp);draw()}
// 表示
const money=new Set([K.base,K.kyu]);
function fmt(c,r){let v=r[c.id]||'';if(c.id===K.no&&v!=='')return String(v).replace(/\D/g,'').padStart(4,'0')||v;
 if(c.id===K.corp)return v;if(money.has(c.id)||c.n&&v!==''){const n=num(v);return isNaN(n)?v:n.toLocaleString()+(c.id===K.base||c.id===K.kyu||c.id.startsWith('v_p')||c.id==='v_hr'?'円':'')}return v}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function draw(){const lim=+$('#lim').value,sl=view.slice(0,lim);$('#cnt').textContent=sl.length+' / '+rows.length+' 件';
 const cs=vis.map(i=>byId[i]);const w=c=>W[c.id]||Math.max(70,c.label.length*14+24);
 let h='<colgroup><col style="width:44px">'+cs.map(c=>`<col style="width:${w(c)}px">`).join('')+'</colgroup><thead><tr><th class="fz">#</th>';
 h+=cs.map(c=>{const s=sort.length&&sort[0].id===c.id?(sort[0].d>0?' ▲':' ▼'):'';return`<th draggable="true" data-id="${c.id}" class="${c.faint?'faint':''}" title="${esc(c.label)}">${esc(c.label)}${s}<span class="rs"></span></th>`}).join('')+'</tr></thead><tbody>';
 h+=sl.map((r,i)=>{r._i=i;return`<tr data-i="${i}"><td class="fz">${i+1}</td>`+cs.map(c=>{const t=esc(fmt(c,r));return`<td class="${c.faint?'faint ':''}${c.n||money.has(c.id)?'num':''}" title="${t}">${t}</td>`}).join('')+'</tr>'}).join('')+'</tbody>';
 const tb=$('#tb');tb.innerHTML=h;tb.style.minWidth=(44+cs.reduce((a,c)=>a+w(c),0))+'px';tb._sl=sl}
const tb=$('#tb');let drag=null,rz=null;
tb.addEventListener('click',e=>{const th=e.target.closest('th[data-id]');if(!th||e.target.className==='rs')return;const id=th.dataset.id;sort=[{id,d:sort[0]&&sort[0].id===id?-sort[0].d:1}];run()});
tb.addEventListener('dblclick',e=>{const tr=e.target.closest('tr[data-i]');if(tr)detail(tb._sl[+tr.dataset.i])});
tb.addEventListener('mousedown',e=>{if(e.target.className==='rs'){const th=e.target.parentNode;th.draggable=false;rz={id:th.dataset.id,x:e.clientX,w:th.offsetWidth,th};e.preventDefault()}});
addEventListener('mousemove',e=>{if(rz){W[rz.id]=Math.max(40,rz.w+e.clientX-rz.x);const i=vis.indexOf(rz.id)+1;tb.querySelectorAll('col')[i].style.width=W[rz.id]+'px';tb.style.minWidth=(44+vis.reduce((a,id)=>a+(W[id]||Math.max(70,byId[id].label.length*14+24)),0))+'px'}});
addEventListener('mouseup',()=>{if(rz){rz.th.draggable=true;rz=null}});
tb.addEventListener('dragstart',e=>{drag=e.target.dataset&&e.target.dataset.id;e.dataTransfer.setData('text','x')});
tb.addEventListener('dragover',e=>{const th=e.target.closest('th[data-id]');if(th&&drag){e.preventDefault();tb.querySelectorAll('th.over').forEach(x=>x.classList.remove('over'));th.classList.add('over')}});
tb.addEventListener('drop',e=>{const th=e.target.closest('th[data-id]');if(!th||!drag)return;e.preventDefault();const a=vis.indexOf(drag),b=vis.indexOf(th.dataset.id);if(a!==b){vis.splice(a,1);vis.splice(b,0,drag)}drag=null;draw()});
tb.addEventListener('dragend',()=>{drag=null;tb.querySelectorAll('th.over').forEach(x=>x.classList.remove('over'))});
// 列追加
const cm=$('#colm');function colMenu(){cm.innerHTML=ALL.map(c=>`<label class="${c.faint?'faint':''}"><input type="checkbox" value="${esc(c.id)}" ${vis.includes(c.id)?'checked':''}> ${esc(c.label)}</label>`).join('')}
$('#addc').onclick=e=>{e.stopPropagation();colMenu();cm.style.display=cm.style.display=='block'?'none':'block'};
cm.onclick=e=>e.stopPropagation();document.addEventListener('click',()=>cm.style.display='none');
cm.onchange=e=>{const id=e.target.value;if(e.target.checked){const anc={v_sg:K.sg,v_hr:K.hol,v_pm:'v_hr',v_pb:'v_pm'}[id];const i=anc?vis.indexOf(anc):-1;i>=0?vis.splice(i+1,0,id):vis.push(id)}else vis=vis.filter(x=>x!==id);draw()};
// モーダル
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.mask').style.display='none');
document.querySelectorAll('.mask').forEach(m=>m.addEventListener('mousedown',e=>{}));
addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.mask').forEach(m=>m.style.display='none')});
function detail(r){$('#dt').textContent=(r[K.nm]||'')+'　管理No '+fmt({id:K.no},r);let h='',g='';cols.forEach(c=>{if(c.g!==g){if(g)h+='</div>';g=c.g;h+=`<h3>${esc(g)}</h3><div class="dg">`}h+=`<b class="${c.faint?'faint':''}">${esc(c.label)}</b><div class="${c.faint?'faint':''}">${esc(fmt(c,r))}</div>`});$('#db').innerHTML=h+'</div>';$('#det').style.display='flex'}
// 詳細検索UI
const cb=(n,v,l,t='checkbox')=>`<label><input type="${t}" name="${n}" value="${v}"> ${l}</label>`;
const ra=(n,a)=>a.map(([v,l],i)=>cb(n,v,l,'radio')).join('');
$('#gc').innerHTML=`<b>月給（基本給＋手当＋残業代）</b><div>${['149,999円以下','150,000円 - 174,999円','175,000円 - 199,999円','200,000円 - 249,999円','250,000円以上'].map((l,i)=>cb('kyu',i,l)).join('')}</div>
<b>賞与</b><div>${ra('bn',[['あり','あり'],['なし','なし'],['','指定なし']])}</div>
<b>希望する休日</b><div>${DAYS.map((l,i)=>cb('day',i,l+(i<7?'曜':'')).replace('祝曜','祝')).join('')}</div>
<b>年間休日数</b><div>${['99日以下','100日 - 109日','110日 - 119日','120日 - 129日','130日以上'].map((l,i)=>cb('hol',i,l)).join('')}</div>
<b>転勤</b><div>${cb('tn',1,'転勤なし')}</div>
<b>入居可能住宅</b><div>${cb('hs',0,'単身用あり')}${cb('hs',1,'世帯用あり')}</div>
<b>時間外労働</b><div><label><input type="radio" name="ot" value="あり"> あり（月平均 <input id="otm" type="number" style="width:50px;height:20px"> 時間以下）</label>${ra('ot',[['なし','なし'],['','指定なし']])}</div>
<b>勤務制度</b><div>${['交替制（シフト制）','裁量労働制','フレックスタイム制','変形労働時間制','上記のような特別な勤務制度ではない'].map((l,i)=>cb('wt',i,l)).join('')}</div>`;
document.querySelectorAll('#gc input[type=radio][value=""]').forEach(e=>e.checked=true);
$('#q').addEventListener('dblclick',()=>$('#adv').style.display='flex');
$('#clr').onclick=()=>{document.querySelectorAll('#adv input').forEach(e=>{e.type==='checkbox'?e.checked=false:e.type==='radio'?e.checked=e.value==='':e.value=''});$('#fk').value='';run()};
['#q','#fw','#kn','#ad','#otm'].forEach(s=>$(s).addEventListener('input',run));$('#adv').addEventListener('change',run);$('#lim').onchange=draw;
load();
</script></body></html>
