 <div class="h1"><b>受付求人票</b><input id="q" placeholder="事業所名 / 所在地 / 就業場所 / 求人番号 / 管理No / 職業分類（ダブルクリックで詳細検索）"></div>
 <div class="h2"><label>表示数 <select id="ps"><option>50<option selected>100<option>300<option>400<option>500</select></label><span id="cnt"></span><span id="status" class="status">データ読込待ち</span><button id="loadcsv">CSVを選択</button><button id="addc">＋列追加</button></div>

<div><b>時間外労働</b><br><label><input type="radio" name="ot" value="あり">あり（月平均<input type="text" id="otn" style="width:40px;height:20px">時間以下）</label><label><input type="radio" name="ot" value="なし">なし</label><label><input type="radio" name="ot" value="" checked>指定なし</label></div></div>
<b>希望する休日</b> <span id="fho"></span><br>
<b>その他</b> <label><input type="checkbox" id="ftn">転勤なし</label><label><input type="checkbox" id="fta">単身用住宅あり</label><label><input type="checkbox" id="fse">世帯用住宅あり</label><br>
<b>勤務制度</b> <span id="fsy"></span></fieldset>

<div class="db" id="mb"></div></div></div>

<script>
const MAP=`求人年度|年度
求人番号|求人番号
受付安定所|受付所
事業所番号|事業所No
インターネットへの公開|WEB公開
事業所名 カナ|事業所カナ
事業所名|事業所名
郵便番号（所在地）|所在_郵便No

求人数（通勤）|通勤求人

賞与有無（新卒）|賞与

時間外労働の月平均時間数|平均残業時間
変形労働時間制の種類|労働時間の種類
休日等|休日
就業時間1|就業時間1
就業時間2|就業時間2
就業時間3|就業時間3
年間休日数|年間休日
複数応募の受け入れ|複数応募
複数応募開始の日程|複数応募日程
職場見学の受け入れ|職場見学
職場見学の日程|見学日程
課係名・役職名（担当者）|担当役職
氏名（担当者）|担当者
氏名カナ（担当者）|担当者カナ
電話番号（担当者）|担当TEL
FAX（担当者）|担当FAX
Eメール（担当者）|担当メール
補足事項|補足
特記事項|特記
産業分類|産業分類NO
職業分類（3桁）|職業分類1
職業分類（5桁）|職業分類1
職業分類2（3桁）|職業分類2
職業分類2（5桁）|職業分類2
就業場所住所（市区町村）|就業_市区町村1
就業場所住所2（市区町村）|就業_市区町村2
就業場所住所3（市区町村）|就業_市区町村3
管理番号|管理No
対象学科|対象学科
エリア|エリア
卒業生の入社実績|入社実績
その他の分類|その他分類
募集人数|募集人数
来校の有無|来校
二次募集の有無|二次募集
職場見学人数|見学人数
応募人数|応募人数
入社人数|入社人数
備考|備考
申送り事項|申送り事項
公開日時|公開日時
最終更新日時|更新日時
登録方法|登録方法
元ファイル名|元ファイル
職業分類（ハローワーク）大分類|HW職業大分類
職業分類（ハローワーク）中分類|HW職業中分類
職業分類（ハローワーク）小分類|HW職業小分類
職業分類（handy）大分類|handy職業大分類
職業分類（handy）中分類|handy職業中分類
職業分類2（ハローワーク）大分類|HW職業2大分類
職業分類2（ハローワーク）中分類|HW職業2中分類
職業分類2（ハローワーク）小分類|HW職業2小分類
職業分類2（handy）大分類|handy職業2大分類
職業分類2（handy）中分類|handy職業2中分類
お気に入り登録数|お気に入り数
職業分類コード（日本標準職業分類への変換）|標準職業1コード
職業分類（日本標準職業分類への変換）|標準職業分類1
職業分類2コード（日本標準職業分類への変換）|標準職業2コード
職業分類2（日本標準職業分類への変換）|標準職業分類2`.split('\n').map(l=>l.split('|'));
const BASE='https://soo-hs.github.io/soohs/kyujin/';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=s=>{const m=String(s==null?'':s).replace(/,/g,'').match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN};
const nz=s=>String(s==null?'':s).normalize('NFKC').toLowerCase();
const yen=n=>isFinite(n)?'¥'+Math.round(n).toLocaleString():'';
let ROWS=[],SANGYO={},VIEW=[],sort={id:null,dir:-1},vis=[],COLS=[],CM={};

async function getText(f){
 const urls=[f,BASE+encodeURIComponent(f)];
 for(const u of urls){
  try{
   const r=await fetch(u,{cache:'no-store'});
   if(!r.ok)continue;
   const b=await r.arrayBuffer();
   let t=new TextDecoder('utf-8').decode(b);
   if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(b);
   return t.replace(/^\ufeff/,'');
  }catch(e){}
 }
 throw new Error(f+' を読み込めません。Webサーバーで開くか、「CSVを選択」からファイルを指定してください。');
}
async function getLocalFileText(file){
 const b=await file.arrayBuffer();
 let t=new TextDecoder('utf-8').decode(b);
 if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(b);
 return t.replace(/^\ufeff/,'');
}
function parseCSV(t){const out=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==',')r.push(f),f='';
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')out.push(r);r=[]}
  else f+=c}
 if(f!==''||r.length){r.push(f);out.push(r)}return out}

const calc=r=>{if(r._c)return r._c;const k=num(r['年間休日数']),g=num(r['月給（基本給+手当+残業代）']),z=num(r['時間外労働の月平均時間数']),b=num(r['基本給']);
 const h=(isFinite(k)?Math.max(1,365-k):NaN)*8/12,w=g/h,c={w:'',p:'',b:''};
 if(isFinite(w)&&h>0){c.w=Math.round(w);c.p=Math.round(g+w*(isFinite(z)?z:0)*1.25)}
 if(String(r['賞与有無（新卒）']||'').includes('あり')&&isFinite(b))c.b=Math.round(b*2);
 return r._c=c};
const city=r=>[1,2,3].map(i=>r['就業場所住所'+(i>1?i:'')+'（市区町村）']).filter(Boolean).join('/');
const total=r=>{const a=['通勤','住込','不問'].map(k=>num(r['求人数（'+k+'）']));return a.some(isFinite)?a.reduce((s,v)=>s+(isFinite(v)?v:0),0):''};
const occ=r=>[r['職業分類（日本標準職業分類への変換）'],r['職業分類2（日本標準職業分類への変換）']].filter(Boolean).join(' / ');
const pad=s=>{const n=String(s||'').trim();return /^\d+$/.test(n)?n.padStart(4,'0'):n};
const sname=r=>{let v=String(r['産業分類']||'').trim();if(/^\d+$/.test(v))v=v.padStart(3,'0');return SANGYO[v]||''};
function buildCols(){
 const cnt={};MAP.forEach(m=>cnt[m[1]]=(cnt[m[1]]||0)+1);
 COLS=[];
 MAP.forEach(([o,s])=>{
  const label=cnt[s]>1?s+((o.match(/（\d桁）/)||[''])[0]):s;
  const d={id:o,label,w:110,get:r=>r[o]||''};
  if(o=='管理番号')d.get=r=>pad(r[o]),d.w=60;
  if(o=='基本給'||o.startsWith('月給')){d.money=1;d.get=r=>yen(num(r[o]));d.w=90}
  if(o=='事業所名'||o=='住所（所在地）')d.w=200;
  COLS.push(d);
  if(o=='年間休日数'){
   COLS.push({id:'_w',label:'時間あたりの賃金',dim:1,w:110,calc:1,get:r=>{const v=calc(r).w;return v===''?'':v.toLocaleString()}});
   COLS.push({id:'_p',label:'予想月給',dim:1,w:90,calc:1,get:r=>{const v=calc(r).p;return v===''?'':v.toLocaleString()}});
   COLS.push({id:'_b',label:'予想賞与',dim:1,w:90,calc:1,get:r=>{const v=calc(r).b;return v===''?'':v.toLocaleString()}})}
  if(o=='産業分類')COLS.push({id:'_s',label:'産業分類名',dim:1,w:160,get:sname});
 });
 COLS.push({id:'_c',label:'就業場所',w:140,get:city},{id:'_t',label:'求人数(計)',w:70,get:total},{id:'_o',label:'職業分類(標準)',w:170,get:occ});
 COLS.forEach(c=>CM[c.id]=c);
 vis=['管理番号','事業所名','住所（所在地）','従業員数（企業全体）','従業員数（就業場所）','資本金','_c','_t','_o','月給（基本給+手当+残業代）','年間休日数','賞与有無（新卒）','求人番号','インターネットへの公開','来校の有無']}

function sv(c,r){const col=CM[c];
 if(c=='管理番号'||c=='_t'||c=='_w'||c=='_p'||c=='_b'||col.money||/人数|数$/.test(col.label)){const n=num(c=='_t'?total(r):c=='_w'?calc(r).w:c=='_p'?calc(r).p:c=='_b'?calc(r).b:r[c]);return isFinite(n)?n:-Infinity}
 return col.get(r)}
function cmp(a,b){return typeof a=='number'&&typeof b=='number'?(a==b?0:a<b?-1:1):String(a).localeCompare(String(b),'ja')}
const nv=v=>isFinite(v)?v:-Infinity;
function doSort(){
 if(!sort.id)VIEW.sort((a,b)=>cmp(nv(num(b['求人年度'])),nv(num(a['求人年度'])))||cmp(nv(num(b['管理番号'])),nv(num(a['管理番号']))));
 else{const d=sort.dir;VIEW.sort((a,b)=>d*cmp(sv(sort.id,a),sv(sort.id,b)))}}
function render(){
 const n=+$('#ps').value,rows=VIEW.slice(0,n);
 const cols=[{id:'#',label:'#',w:44},...vis.map(id=>CM[id])];
 const tw=cols.reduce((s,c)=>s+c.w,0);
 let h=`<table style="width:${tw}px"><colgroup>${cols.map(c=>`<col style="width:${c.w}px">`).join('')}</colgroup><thead><tr>`;
 cols.forEach(c=>{const ar=sort.id==c.id?(sort.dir>0?' ▲':' ▼'):'';
  h+=`<th data-id="${esc(c.id)}" class="${c.id=='#'?'fx':''}${c.dim?' dim':''}" ${c.id=='#'?'':'draggable="true"'} title="${esc(c.label)}">${esc(c.label)}${ar}${c.id=='#'?'':'<span class="rz"></span>'}</th>`});
 h+='</tr></thead><tbody>';
 rows.forEach((r,i)=>{h+=`<tr data-i="${r._i}"><td class="fx">${i+1}</td>`;
  cols.slice(1).forEach(c=>{const v=String(c.get(r));h+=`<td class="${c.money||c.calc?'m':''}${c.dim?' dim':''}" title="${esc(v)}">${esc(v)}</td>`});h+='</tr>'});
 h+='</tbody></table>';
 $('#wrap').innerHTML=VIEW.length?h:'<div id="msg">該当する求人がありません</div>';
 $('#cnt').innerHTML=`<b>${rows.length.toLocaleString()}</b> / ${VIEW.length.toLocaleString()} 件${VIEW.length!=ROWS.length?`（全${ROWS.length.toLocaleString()}）`:''}`;
 bindHead()}

function bindHead(){
 const ths=[...document.querySelectorAll('th')];let drag=null;
 ths.forEach(th=>{const id=th.dataset.id;
  th.onclick=e=>{if(id=='#'||e.target.classList.contains('rz'))return;sort=sort.id==id?{id,dir:-sort.dir}:{id,dir:1};doSort();render()};
  th.ondragstart=e=>{drag=id;e.dataTransfer.setData('text/plain',id)};
  th.ondragover=e=>{if(drag&&id!='#'){e.preventDefault();th.classList.add('over')}};
  th.ondragleave=()=>th.classList.remove('over');
  th.ondrop=e=>{e.preventDefault();if(!drag||drag==id||id=='#')return;vis.splice(vis.indexOf(drag),1);vis.splice(vis.indexOf(id),0,drag);drag=null;render()};

function termMatch(text,q){const t=nz(text);return nz(q).split(/\s+/).filter(Boolean).every(w=>w.split('/').filter(Boolean).some(x=>t.includes(x)))}
function orMatch(text,q){const t=nz(text),p=nz(q).split('/').map(s=>s.trim()).filter(Boolean);return !p.length||p.some(x=>t.includes(x))}
function simpleText(r){return r._s||(r._s=[r['事業所名'],r['住所（所在地）'],r['住所（就業場所）'],r['求人番号'],r['管理番号'],pad(r['管理番号']),...Object.keys(r).filter(k=>k.includes('職業分類')).map(k=>r[k])].join(' '))}

function readDetail(){return{fk:$('#fk').value,fw:$('#fw').value,fid:$('#fid').value,fad:$('#fad').value,jb:chk('jb'),gt:rng('fgt'),ky:rng('fky'),bo:document.querySelector('[name=bo]:checked').value,ot:document.querySelector('[name=ot]:checked').value,otn:num($('#otn').value),ho:chk('ho'),sy:chk('sy'),tn:$('#ftn').checked,ta:$('#fta').checked,se:$('#fse').checked}}
let DET=null;
function detOK(r,d){
 if(d.fw.trim()){const txt=d.fk=='all'?Object.keys(r).filter(k=>k[0]!='_').map(k=>r[k]).join(' '):(d.fk=='管理番号'?r[d.fk]+' '+pad(r[d.fk]):r[d.fk]);if(!termMatch(txt,d.fw))return false}
 if(d.fid.trim()&&!orMatch((r['求人番号']||'')+' '+(r['管理番号']||'')+' '+pad(r['管理番号']),d.fid))return false;
 if(d.fad.trim()&&!orMatch(r['住所（就業場所）']||'',d.fad))return false;
 if(d.jb.length){
  const t=nz((r['職種']||'')+' '+Object.keys(r).filter(k=>k.includes('職業分類')).map(k=>r[k]).join(' '));
  const named=Object.keys(JOBS).filter(j=>j!='その他');
  const matchedNamed=named.some(j=>JOBS[j].some(k=>t.includes(nz(k))));
  const hit=d.jb.some(j=>j=='その他'?!matchedNamed:JOBS[j].some(k=>t.includes(nz(k))));
  if(!hit)return false
 }
 const g=num(r['月給（基本給+手当+残業代）']);if(d.gt.length&&!d.gt.some(([a,b])=>g>=a&&g<=b))return false;
 const k=num(r['年間休日数']);if(d.ky.length&&!d.ky.some(([a,b])=>k>=a&&k<=b))return false;
 const bo=String(r['賞与有無（新卒）']||'');if(d.bo=='あり'&&!bo.includes('あり'))return false;if(d.bo=='なし'&&!bo.includes('なし'))return false;
 const ot=String(r['時間外労働の有無']||'');
 if(d.ot=='あり'){if(!ot.includes('あり'))return false;const z=num(r['時間外労働の月平均時間数']);if(isFinite(d.otn)&&!(z<=d.otn))return false}
 if(d.ot=='なし'&&(!ot.includes('なし')||ot.includes('あり')))return false;
 if(d.ho.length){const t=r['休日等']||'';if(!d.ho.some(h=>h=='その他'?/他|不定|シフト/.test(t):h=='祝'?t.includes('祝'):t.includes(h+'曜')))return false}
 if(d.sy.length){const t=r['変形労働時間制の種類']||'';const hit=d.sy.some(s=>s.startsWith('上記')?(!t||/なし|無/.test(t)):t.includes(s.slice(0,2)));if(!hit)return false}
 if(d.tn&&!String(r['転勤の可能性']||'').includes('なし'))return false;
 if(d.ta&&!String(r['入居可能住宅（単身用）']||'').includes('あり'))return false;
 if(d.se&&!String(r['入居可能住宅（世帯用）']||'').includes('あり'))return false;
 return true}

const GR=[['基本情報',0,4],['事業所情報',5,18],['仕事内容',19,28],['就業条件',29,32],['給与・労働時間',33,43],['応募・見学',44,47],['担当者',48,53],['補足・特記',54,55]];
let CUR=null;
function openModal(r){CUR=r;$('#ovm').classList.add('on');$('#bk').style.display='none';$('#simb').style.display='';
 $('#mt').textContent=`${pad(r['管理番号'])}　${r['事業所名']||''}　（求人番号 ${r['求人番号']||''}）`;
 const used=new Set(['管理番号']),dl=items=>`<dl>${items.map(([k,v,d])=>`<dt class="${d?'dim':''}">${esc(k)}</dt><dd class="${d?'dim':''}">${esc(v)}</dd>`).join('')}</dl>`;
 let h='';
 GR.forEach(([n,a,b])=>{const it=[];
  if(a==0)it.push([CM['管理番号'].label,pad(r['管理番号'])]);
  for(let i=a;i<=b;i++){const o=MAP[i][0];used.add(o);const c=CM[o];it.push([c.label,c.get(r)]);
   if(o=='年間休日数')['_w','_p','_b'].forEach(id=>it.push([CM[id].label,CM[id].get(r),1]))}
  h+=`<div class="grp"><h3>${n}</h3>${dl(it)}</div>`});
 const skip=['_w','_p','_b','_c','_t','_o'];
 h+=`<div class="grp"><h3>分類・管理・その他</h3>${dl(COLS.filter(c=>!used.has(c.id)&&!skip.includes(c.id)).map(c=>[c.label,c.get(r),c.dim]))}</div>`;
 $('#mb').innerHTML=h;$('#mb').scrollTop=0}
const bg=s=>{s=nz(s).replace(/\s/g,'');const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.substr(i,2));return o};
const cty=a=>[1,2,3].map(i=>a['就業場所住所'+(i>1?i:'')+'（市区町村）']).filter(Boolean);
function score(a,b){let s=0;
 const ca=String(a['産業分類']||'').trim(),cb=String(b['産業分類']||'').trim();const ca3=/^\d+$/.test(ca)?ca.padStart(3,'0'):ca,cb3=/^\d+$/.test(cb)?cb.padStart(3,'0'):cb;
 if(a['産業分類']&&ca3&&ca3==cb3)s+=15;else if(a['産業分類']&&ca3&&cb3&&ca3.slice(0,2)==cb3.slice(0,2))s+=8;
 const K='職業分類コード（日本標準職業分類への変換）',K2='職業分類2コード（日本標準職業分類への変換）';
 const o1=String(a[K]||''),o2=String(a[K2]||''),p1=String(b[K]||''),p2=String(b[K2]||'');
 if(o1&&o1==p1)s+=25;else if(o1&&(o1==p2||(o2&&o2==p1)))s+=18;else if(o1&&o1.slice(0,2)==p1.slice(0,2))s+=12;
 if(a['雇用形態']&&a['雇用形態']==b['雇用形態'])s+=8;
 const M='月給（基本給+手当+残業代）',g1=num(a[M]),g2=num(b[M]);
 if(isFinite(g1)&&isFinite(g2))s+=15*Math.max(0,1-Math.abs(g1-g2)/Math.max(g1,g2)/.3);
 const k1=num(a['年間休日数']),k2=num(b['年間休日数']);if(isFinite(k1)&&isFinite(k2))s+=8*Math.max(0,1-Math.abs(k1-k2)/30);
 const B='賞与有無（新卒）';if(String(a[B]||'').includes('あり')==String(b[B]||'').includes('あり'))s+=5;
 if((a['転勤の可能性']||'')==(b['転勤の可能性']||''))s+=3;
 if((a['マイカー通勤の可否']||'')==(b['マイカー通勤の可否']||''))s+=3;
 const x=cty(a),y=cty(b);if(x.some(v=>y.includes(v)))s+=10;
 const A=bg(a['職種']||''),C=bg(b['職種']||'');if(A.size&&C.size){let i=0;A.forEach(v=>C.has(v)&&i++);s+=8*i/(A.size+C.size-i)}
 return Math.round(s*10)/10}

async function loadData(csvText,sourceName='kyujin2026.csv'){
 const t=parseCSV(csvText);
 if(!t.length||!t[0]||!t[0].length)throw new Error('CSVにヘッダー行がありません。');
 const hd=t[0].map(x=>String(x).trim());
 if(!hd.includes('求人番号')&&!hd.includes('事業所名'))throw new Error('求人CSVの形式を認識できません。');
 ROWS=t.slice(1).filter(v=>v.some(x=>String(x??'').trim()!='')).map((v,i)=>{
  const o={_i:i};hd.forEach((k,j)=>o[k]=v[j]==null?'':v[j]);return o
 });
 DET=null;sort={id:null,dir:-1};filter();
 $('#status').textContent=`${sourceName}：${ROWS.length.toLocaleString()}件`;
}
async function boot(){
 buildCols();
 try{
  const [c,s]=await Promise.all([getText('kyujin2026.csv'),getText('産業分類.txt').catch(()=>'')]);
  s.split(/\r?\n/).forEach(l=>{const i=l.indexOf(',');if(i>0)SANGYO[l.slice(0,i).trim()]=l.slice(i+1).trim()});
  await loadData(c,'kyujin2026.csv');
 }catch(e){
  $('#status').textContent='CSV未読込';
  $('#wrap').innerHTML='<div id="msg">'+esc(e.message)+'<br><br><button id="errload">CSVを選択して読み込む</button></div>';
  $('#errload').onclick=()=>$('#loadcsv').click();
 }
}
const fileInput=document.createElement('input');
fileInput.type='file';fileInput.accept='.csv,text/csv';fileInput.style.display='none';
document.body.appendChild(fileInput);
$('#loadcsv').onclick=()=>fileInput.click();
fileInput.onchange=async()=>{
 const f=fileInput.files[0];if(!f)return;
 try{await loadData(await getLocalFileText(f),f.name)}catch(e){
  $('#status').textContent='読込エラー';
  $('#wrap').innerHTML='<div id="msg">'+esc(e.message)+'</div>';
 }
 fileInput.value='';
};
boot();
