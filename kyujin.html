<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/jpeg" href="https://soo-hs.github.io/soohs/soo_hs.jpg">
<link rel="apple-touch-icon" href="https://soo-hs.github.io/soohs/soo_hs.jpg">
<title>受付求人票</title>
<style>
:root{--navy:#2b4c97;--navy-d:#1d3578;--navy-l:#eaf0fc;--navy-m:#cfdaf3;--amber:#f6a81c;--amber-d:#c58200;--amber-l:#fff3d6;--ink:#1d2a4a;--mute:#97a3bd;--line:#d9e0ef}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:12px/1.2 "Meiryo","Yu Gothic UI","Hiragino Sans",sans-serif;color:var(--ink);background:#f3f6fc;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(#3560b8,var(--navy));color:#fff;padding:4px 8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border-bottom:3px solid var(--amber);flex:0 0 auto}
.g1{display:flex;align-items:center;gap:6px;flex:1 1 440px;min-width:0}
.g2{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:wrap}
h1{margin:0;font-size:15px;white-space:nowrap;cursor:pointer;user-select:none;letter-spacing:.05em}
h1 small{font-size:10px;color:var(--amber);margin-left:4px}
input,select,button{font:inherit;height:24px}
#q{flex:1 1 0;min-width:60px;border:1px solid #fff0;border-radius:4px;padding:0 8px;background:#fff;color:var(--ink)}
#q:focus,select:focus{outline:2px solid var(--amber)}
select{border:0;border-radius:4px;padding:0 4px;background:#fff;color:var(--ink)}
#yrl{display:flex;align-items:center;gap:5px;white-space:nowrap;color:#fff;font-weight:bold;font-size:13px}
#yr.yrv{color:#ffd37a;font-weight:bold;font-size:14px;border-bottom:2px solid var(--amber);padding:0 3px}
label[for=yr] b{color:var(--amber);font-size:13px}
button{border:0;border-radius:4px;padding:0 10px;background:var(--amber);color:#3a2800;font-weight:bold;cursor:pointer;white-space:nowrap}
button:hover{background:#ffbd3d}
button.nar{padding:0 5px;font-size:11px}
button.sub{background:#fff;color:var(--navy-d)}
button.sub:hover{background:var(--amber-l)}
label.l{display:flex;align-items:center;gap:3px;white-space:nowrap}
#cnt{white-space:nowrap;color:#fff;font-weight:bold}
#cnt small{color:var(--navy-m);font-weight:normal}
#cnt a{font-size:10px;font-weight:normal;color:var(--amber);cursor:pointer;text-decoration:underline;margin-left:4px;user-select:none}
#cnt a.off{color:var(--navy-m);cursor:default;text-decoration:none;opacity:.6}
#advchip{background:var(--amber);color:#3a2800;border-radius:10px;padding:2px 8px;cursor:pointer;white-space:nowrap;font-weight:bold}
#wrap{flex:1 1 auto;overflow:auto;background:#fff;position:relative}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{padding:2px 6px;border-bottom:1px solid var(--line);border-right:1px solid #eef1f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
th{position:sticky;top:0;z-index:3;background:var(--navy-m);color:var(--navy-d);height:26px;text-align:left;cursor:pointer;user-select:none;border-bottom:2px solid var(--amber)}
th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
th .rz:hover{background:var(--amber)}
th.over{background:var(--amber-l)}
th.n,td.n{position:sticky;left:0;text-align:right;cursor:default;background:var(--navy-l);color:var(--navy-d)}
th.n{z-index:5;background:var(--navy-m)}
td.n{z-index:2}
tbody tr:nth-child(even) td{background:#f8faff}
tbody tr:nth-child(even) td.n{background:var(--navy-l)}
tbody tr:hover td{background:var(--amber-l)}
.dim,th.dim{color:var(--mute)}
th.dim{color:#7e8cab}
td.num{text-align:right}
#msg{padding:30px;text-align:center;color:var(--navy-d);white-space:pre-wrap}
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--navy);border-radius:6px;box-shadow:0 6px 20px #0003;padding:6px;width:min(760px,96vw);max-height:70vh;display:flex;flex-direction:column;gap:4px}
.menu input[type=search]{border:1px solid var(--navy-m);border-radius:4px;padding:0 6px}
.menu .ls{overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px;align-content:start}
@media (max-width:640px){.menu .ls{grid-template-columns:repeat(2,1fr)}}
@media (max-width:380px){.menu .ls{grid-template-columns:1fr}}
@media (min-width:1100px){.menu .ls{grid-template-columns:repeat(4,1fr)}.menu{width:min(980px,96vw)}}
.menu label{display:flex;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-items:center;padding:2px 4px;cursor:pointer}
.menu label:hover{background:var(--amber-l)}
.menu label.dim{color:var(--mute)}
.ov{position:fixed;inset:0;background:#0a1a4a66;z-index:100;display:flex;align-items:center;justify-content:center;padding:10px}
.ov[hidden]{display:none!important}
.dlg{background:#fff;border-radius:8px;box-shadow:0 10px 40px #0006;max-height:96vh;width:min(1000px,100%);display:flex;flex-direction:column;overflow:hidden;border-top:4px solid var(--amber)}
.dlg.wide{width:min(1400px,100%)}
.dlg.adv{width:min(760px,100%)}
.dh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--navy);color:#fff;font-size:14px}
.dh .sp{flex:1}
.dh button.x{background:transparent;color:#fff;font-size:20px;padding:0 8px;height:28px;border:1px solid #fff6}
.dh button.x:hover{background:var(--amber);color:#3a2800}
.db{overflow:auto;padding:8px 10px;flex:1}
.grp{margin-bottom:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.grp h3{margin:0;padding:3px 8px;background:var(--navy-l);color:var(--navy-d);font-size:12px;border-left:4px solid var(--amber)}
.grp dl{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0}
.grp .it{display:flex;gap:6px;padding:3px 8px;border-bottom:1px dotted var(--line);min-width:0}
.grp .it.full{grid-column:1/-1}
.grp dt{flex:0 0 105px;color:var(--navy);font-weight:bold}
.grp dt.dim{color:var(--mute)}
.grp dd{margin:0;flex:1;white-space:pre-wrap;word-break:break-all}
.grp dd.dim{color:var(--mute)}
.grp .it.empty dd{color:#c3cadb}
/* adv */
.dlg.adv .db{padding:6px 10px}
.af-sec{font-weight:bold;color:var(--navy-d);margin:6px 0 2px}
.af-row{display:flex;gap:6px}
.af-row select{border:1px solid var(--navy-m);flex:0 0 auto}
.af-row input[type=text]{flex:1;border:1px solid var(--navy-m);border-radius:4px;padding:0 6px}
table.af{width:100%;table-layout:auto;border:1px solid var(--navy-m)}
table.af th{position:static;width:96px;white-space:normal;vertical-align:top;background:var(--navy-l);color:var(--navy-d);cursor:default;border-bottom:1px solid var(--navy-m);height:auto;padding:4px 6px;font-size:11px}
table.af td{white-space:normal;overflow:visible;padding:3px 6px;border-bottom:1px solid var(--navy-m)}
.opts{display:flex;flex-wrap:wrap;gap:2px 14px}
.opts label{display:flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer}
.opts input{height:auto;margin:0}
#af-otn{width:48px;height:20px;border:1px solid var(--navy-m);border-radius:3px;padding:0 3px}
.af-ft{display:flex;gap:8px;justify-content:flex-end;padding:6px 10px;border-top:1px solid var(--line);background:var(--navy-l);align-items:center}
.af-ft button{height:20px;font-size:11px;padding:0 8px}
.af-ft span{margin-right:auto;color:var(--navy-d);font-weight:bold}
/* similar */
.sim{width:100%;table-layout:auto}
.sim td,.sim th{white-space:nowrap;max-width:260px}
.sim th{position:sticky;top:0}
.sim tbody tr{cursor:pointer}
.bar{display:inline-block;height:8px;background:var(--amber);border-radius:4px;vertical-align:middle;margin-right:4px}
.chip{display:inline-block;background:var(--navy-l);color:var(--navy-d);border-radius:8px;padding:1px 6px;margin-right:2px;font-size:11px}
.base{background:var(--amber-l);border:1px solid var(--amber);border-radius:6px;padding:4px 8px;margin-bottom:6px}
@media (max-width:760px){
 .sim thead{display:none}
 .sim,.sim tbody,.sim tr,.sim td{display:block;width:100%}
 .sim tr{border:1px solid var(--navy-m);border-radius:6px;margin-bottom:6px;padding:3px 0;background:#fff}
 .sim td{border:0;white-space:normal;max-width:none;display:flex;gap:6px;padding:1px 8px}
 .sim td::before{content:attr(data-l);flex:0 0 70px;color:var(--navy);font-weight:bold}
 .grp dl{grid-template-columns:1fr}
}
.ck h4{margin:8px 0 2px;color:var(--navy-d);border-left:4px solid var(--amber);padding-left:6px}
.ck table{table-layout:auto;width:100%}
.ck td,.ck th{white-space:normal;position:static}
.ok{color:#1e8a4c}.ng{color:#c0392b}
</style>
</head>

<header>
 <div class="g1">

  <span id="advchip" hidden></span>
  <button id="clr" class="sub nar">クリア</button>

 <div class="g2">

  <label class="l">表示数<select id="ps"><option>50</option><option selected>100</option><option>300</option><option>400</option><option>500</option><option value="0">全て</option></select></label>

  <button id="addc" class="nar">＋列追加</button>
  <button id="chk" class="sub nar" title="データ検証一覧">検証</button>
 </div>
</header>
<div id="wrap"><div id="msg">読み込み中…</div></div>

function parseCSV(t){
 const rows=[];let row=[],f='',q=false,i=0;const n=t.length;
 while(i<n){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
  if(c==='"'){q=true;i++;continue;}
  if(c===','){row.push(f);f='';i++;continue;}
  if(c==='\r'){i++;continue;}
  if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
  f+=c;i++;}
 if(f!==''||row.length){row.push(f);rows.push(row);}
 return rows;
}
function decode(buf){
 let t;
 try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){t=new TextDecoder('shift_jis').decode(buf);}
 return t.charCodeAt(0)===0xFEFF?t.slice(1):t;
}

    if(p==='')return 1;if(q==='')return -1;
    r=p<q?-1:1;
   }
   if(r)return r*s.d;
  }
  return 0;
 };
 return a.slice().sort(cmp);
}

function bg(r,key,fields){
 if(r[key])return r[key];
 const t=fields.map(f=>r[f]||'').join(' ').replace(/[\s\u3000、。・,，.（）()「」\/]+/g,'');
 const s=new Set();for(let i=0;i<t.length-1;i++)s.add(t.slice(i,i+2));
 return r[key]=s;
}
function jac(a,b){if(!a.size||!b.size)return null;let c=0;const[s,l]=a.size<b.size?[a,b]:[b,a];s.forEach(x=>{if(l.has(x))c++;});return c/(a.size+b.size-c);}
function similar(base){
 const bt=bg(base,'__bgT',['職種']),bw=bg(base,'__bgW',['仕事内容']);
 const bm=num(base['月給']),bd=num(base['年間休日']),bo=num(base['平均残業時間']);
 const res=[];
 for(const r of DATA){
  if(r===base)continue;
  let got=0,den=0;const why=[];
  const add=(w,ratio,label)=>{if(ratio==null)return;den+=w;got+=w*ratio;if(ratio>=0.6&&label)why.push(label);};
  /* 職業分類 */
  let jr=null;
  if(base['標準職業1コード']&&r['標準職業1コード'])jr=base['標準職業1コード']===r['標準職業1コード']?1:null;
  if(jr==null){
   if(base['HW職業小分類']&&r['HW職業小分類']&&base['HW職業小分類']===r['HW職業小分類'])jr=.8;
   else if(base['HW職業中分類']&&r['HW職業中分類']&&base['HW職業中分類']===r['HW職業中分類'])jr=.5;
   else if(base['HW職業大分類']&&r['HW職業大分類'])jr=base['HW職業大分類']===r['HW職業大分類']?.25:0;
  }
  add(15,jr,'職業分類');
  /* 産業分類 */
  if(base.__sc&&r.__sc)add(10,base.__sc===r.__sc?1:base.__sc.slice(0,2)===r.__sc.slice(0,2)?.5:0,'産業分類');
  add(15,jac(bt,bg(r,'__bgT',['職種'])),'職種');
  add(10,jac(bw,bg(r,'__bgW',['仕事内容'])),'仕事内容');
  const m=num(r['月給']);if(bm!=null&&m!=null)add(15,Math.max(0,1-Math.abs(bm-m)/Math.max(bm,m)*2),'月給');
  const d=num(r['年間休日']);if(bd!=null&&d!=null)add(8,Math.max(0,1-Math.abs(bd-d)/30),'年間休日');
  if(base['賞与']&&r['賞与'])add(5,base['賞与']===r['賞与']?1:0,'賞与');
  if(base['雇用形態']&&r['雇用形態'])add(7,base['雇用形態']===r['雇用形態']?1:0,'雇用形態');
  if(base['転勤']&&r['転勤'])add(3,base['転勤']===r['転勤']?1:0,'転勤');
  const o=num(r['平均残業時間']);if(bo!=null&&o!=null)add(4,Math.max(0,1-Math.abs(bo-o)/30),'残業');
  if(base['就業_市区町村1']&&r['就業_市区町村1'])add(8,base['就業_市区町村1']===r['就業_市区町村1']?1:(base['就業場所住所']||'').slice(0,3)===(r['就業場所住所']||'').slice(0,3)?.35:0,'就業場所');
  if(den<30)continue;
  res.push({r,score:got/den*100,why});
 }
 res.sort((a,b)=>b.score-a.score||cmpNew(b.r,a.r));
 return res.slice(0,50);
}

  wrap.innerHTML='<div id="msg">CSVを読み込めませんでした。\n'+esc(e.message)+'</div>';return;
 }
 const ys=[...new Set(DATA.map(r=>r['年度']).filter(Boolean))].sort((a,b)=>(num(b)||0)-(num(a)||0));
 S.year=ys[0]||'';$('#yr').textContent=S.year||'—';
 buildAdv();
 $('#cnt').title='読込元: '+SRC;
 refresh();
}
$('#ps').onchange=e=>{S.ps=+e.target.value;S.page=0;render();};
$('#cnt').addEventListener('click',e=>{if(e.target.id==='pv'&&S.page>0){S.page--;render();wrap.scrollTop=0;}else if(e.target.id==='nx'&&!e.target.classList.contains('off')){S.page++;render();wrap.scrollTop=0;}});
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value.trim();refresh();},150);});
$('#q').addEventListener('dblclick',()=>{if(advOv)advOv.hidden=false;});
$('#advchip').onclick=()=>{if(advOv)advOv.hidden=false;};
$('#clr').onclick=resetAll;
$('#chk').onclick=()=>{if(DATA.length)showCheck();};
$('#ttl').addEventListener('dblclick',()=>{S.view=S.view==='jobs'?'corp':'jobs';wrap.scrollTop=0;refresh();});
init();
</script>
</body>
</html>
