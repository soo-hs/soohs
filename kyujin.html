dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#0b1b4070}

.dh label{white-space:nowrap;font-size:11px}
.x{border:1px solid #fff6;background:transparent;color:#fff;width:24px;height:22px;border-radius:4px;font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto}
.x:hover{background:var(--am);color:#3b2a00}
.db{flex:1 1 auto;overflow:auto;padding:0}
.sec h4{margin:0;padding:2px 10px;background:#e3ebfa;color:var(--nvd);border-left:4px solid var(--am);font-size:12px;position:sticky;top:0;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.al{flex:0 0 104px;background:#e8eefa;color:var(--nvd);font-weight:700;font-size:11px;padding:3px 6px}
.ao{flex:1;display:flex;flex-wrap:wrap;gap:1px 12px;padding:3px 8px;align-items:center;font-size:11.5px;min-width:0}
.ao label{white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.ao input[type=checkbox],.ao input[type=radio]{margin:0 2px 0 0;width:13px;height:13px}

.af{flex:0 0 auto;display:flex;gap:6px;justify-content:flex-end;padding:4px 10px;border-top:1px solid var(--ln);background:#f3f6fc}

.cs{padding:4px 12px;border-bottom:1px solid var(--ln);background:#f3f6fc;position:sticky;top:0;z-index:1;font-size:11px}

.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px 12px;padding:6px 12px;font-size:11px}

#dDet .pr{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}

#dDet .pr.pn{align-items:stretch}
#dDet .pr.pn .f b{flex:0 0 auto;max-width:8.6em;white-space:normal;word-break:break-all}
#dDet .pr.pn .f span{min-width:0;overflow-wrap:anywhere}

#dDet .pr.pn.meta .f span{font-size:10.2px}

#dChk{width:min(1000px,97vw);height:90vh}
.tb2{width:100%;border-collapse:collapse;table-layout:auto}

<body>
<header>
  <div class="l1">
    <h1 id="ttl" title="ダブルクリックで 事業所No別一覧 ⇔ 求人一覧 を切替">受付求人票<small id="vb"></small></h1>
    <input id="q" type="search" autocomplete="off" placeholder="事業所名(かな・カナ可)/担当者/所在地/就業場所/求人番号/管理No/職業分類  (「/」でOR・ダブルクリックで詳細検索)" title="ダブルクリックで詳細検索">
    <button class="b" id="clr" title="検索条件をすべて消す">クリア</button>
  </div>
  <div class="l2">
    <span class="yl">年度：<b id="yr">-</b></span>
    <label>表示数 <select id="ps"><option>50</option><option selected>100</option><option>300</option><option>400</option><option>500</option><option value="0">全て</option></select></label>
    <span class="cnt"><a id="prv">戻</a><span id="ct"></span><a id="nxt">次</a></span>
    <button class="b" id="addc">＋列追加</button>
    <button class="b" id="chk">検証</button>
  </div>
</header>
<div id="wrap" tabindex="0"><table id="tb"></table><div id="msg">読み込み中…</div></div>

<footer><span class="fl">検索：</span><span id="fs">なし(全件)</span></footer>

<dialog id="dAdv">
  <div class="dh"><b class="t">詳細検索</b><button class="x" data-close style="margin-left:auto" title="閉じる">×</button></div>
  <form id="advF" class="db" onsubmit="return false"></form>
  <div class="af"><button class="b s g" id="advClr" type="button">条件クリア</button><button class="b s" data-close type="button">閉じる</button></div>
</dialog>

<dialog id="dCols">
  <div class="dh"><b class="t">列の追加・削除</b><span style="font-size:9.5px;opacity:.85">チェックで表示／非表示</span><button class="x" data-close style="margin-left:auto">×</button></div>
  <div class="db"><div class="cs"><button class="b s" id="cgTog" type="button">全選択</button></div><div class="cg" id="cg"></div></div>
</dialog>

<dialog id="dDet">
  <div class="dh">
    <b class="t">求人票</b><span id="dT" style="font-weight:700"></span>
    <label><input type="checkbox" class="sf" value="job" checked>職種</label>
    <label><input type="checkbox" class="sf" value="mg" checked>月給</label>
    <label><input type="checkbox" class="sf" value="yh" checked>年休</label>
    <label><input type="checkbox" class="sf" value="loc" checked>場所</label>
    <label style="margin-left:10px"><input type="checkbox" id="showEmpty">空欄も表示</label>
    <button class="b s" id="simB" style="margin-left:auto">類似求人(上位50件)</button>
    <button class="x" data-close>×</button>
  </div>
  <div class="dn" id="dN"></div>
  <div class="db" id="dB"></div>
</dialog>

<dialog id="dSim">
  <div class="dh"><b class="t">類似求人(上位50件)</b><span id="sT" style="font-size:11px"></span><button class="x" data-close style="margin-left:auto">×</button></div>
  <div class="db" id="sB"></div>
</dialog>

<dialog id="dCfm">
  <div class="dh"><b class="t">確認</b></div>
  <div class="db"><div class="cm">この求人票を表示しますか？</div><div class="ci" id="cfI"></div></div>
  <form method="dialog" class="af"><button class="b s g" value="no" id="cfNo">いいえ(No)</button><button class="b" value="yes" id="cfYes" autofocus>はい(Yes)</button></form>
</dialog>

<dialog id="dChk">
  <div class="dh"><b class="t">データ検証</b><span id="kT" style="font-size:11px"></span><button class="x" data-close style="margin-left:auto">×</button></div>
  <div class="db" id="kB"></div>
</dialog>

function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r')f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function decode(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){return new TextDecoder('shift_jis').decode(buf);}
}

  const err=[];

/* 「3,000万円」「1億2千万円」「1億円」「500万」「5000000」→ 円。単位なしの数字はそのまま円として扱う */
function capNum(s){
  const t=nz(s).replace(/[,\s円¥]/g,'');if(!/\d/.test(t))return null;
  const num=x=>Number(x);let v=0,hit=false,m;
  if(m=t.match(/(\d+(?:\.\d+)?)億/)){v+=num(m[1])*1e8;hit=true;}

  else if(m=t.match(/(\d+(?:\.\d+)?)万/)){v+=num(m[1])*1e4;hit=true;}
  if(hit)return v;
  m=t.match(/\d+(?:\.\d+)?/);return m?num(m[0]):null;}

function matchAdv(r,A){
  if(A.fwt.trim()){const t=ns(FWF[A.fws].map(k=>r[k]).join('\n'));if(!hit(t,segs(A.fwt)))return false;}
  if(A.ad.trim()){const t=ns((r['就業場所住所']||'')+'\n'+r._pl);if(!hit(t,segs(A.ad)))return false;}
  if(A.job.length){const ok=A.job.some(i=>JOBRE[i]?JOBRE[i].test(r._jt):!JOBRE.some(re=>re&&re.test(r._jt)));if(!ok)return false;}
  if(A.mg.length&&!A.mg.some(i=>inR(r._mg,MGR[i])))return false;
  if(A.bonus==='あり'&&!bonusYes(r))return false;
  if(A.bonus==='なし'&&!/なし|無/.test(r['賞与']||''))return false;
  if(A.hol.length){const t=nz(r['休日']);if(!A.hol.every(i=>holHit(i,t)))return false;}
  if(A.yh.length&&!A.yh.some(i=>inR(r._yh,YHR[i])))return false;
  if(A.ten&&!/なし|無|ない/.test(r['転勤']||''))return false;
  if(A.house.length&&!A.house.some(i=>{const v=r[i===0?'単身住宅':'世帯住宅']||'';return v&&!/なし|無|不可/.test(v);}))return false;
  if(A.ot==='あり'){if(!/あり|有/.test(r['残業の有無']||''))return false;if(A.otn!=null&&(r._ot==null||r._ot>A.otn))return false;}
  if(A.ot==='なし'&&!(/なし|無/.test(r['残業の有無']||'')||r._ot===0))return false;
  if(A.sys.length){const kind=nz(r['労働時間の種類']);const ts=nz([kind,r['就業時間1'],r['就業時間2'],r['就業時間3'],r['休日']].join(' '));
    const f=[/交替|交代|シフト/.test(ts),/裁量/.test(ts),/フレックス/.test(ts),!!kind&&!/なし|無/.test(kind)];
    f.push(!f.some(Boolean));

}

/* ---------- ソート ---------- */
function sv(r,k){
  /* 数値列は toNum 済みの値で比較する（「18万〜20万」等の範囲表記は null＝空欄扱いで末尾へ） */
  switch(k){case '_cnt':return r._tot;case '_place':return r._pl;case '_occ':return r._oc;case '管理No':return r._k;
    case '月給':return r._mg;case '基本給':return r._kh;case '年間休日':return r._yh;case '平均残業時間':return r._ot;
    case '全社員数':return r._emp;case '就業社員数':return r._emp2;case '資本金':return r._cap;case '_n':return r._n;
    default:return r[k];}
}
function cmp(a,b){
  const ea=a==null||a===''||(typeof a==='number'&&isNaN(a)),eb=b==null||b===''||(typeof b==='number'&&isNaN(b));
  if(ea||eb)return ea&&eb?0:ea?2:-2;
  const na=toNum(a),nb=toNum(b);
  if(na!=null&&nb!=null)return Math.sign(na-nb); /* 差をそのまま返すと±2が空欄判定と衝突するため符号のみ返す */
  return Math.sign(String(a).localeCompare(String(b),'ja',{numeric:true}));
}
function resort(){
  const data=S.view==='list'?S.filtered.slice():makeGroups(S.filtered);
  const sp=S.sort[S.view];
  data.sort((x,y)=>{for(const s of sp){const c=cmp(sv(x,s.k),sv(y,s.k));if(Math.abs(c)===2)return c>0?1:-1;if(c)return c*s.d;}return 0;});
  S.sorted=data;
}
/* 事業所No別: 代表行は「最新の年度 → 管理Noが大きい」求人。_n に求人件数を持たせる */
function newer(a,b){const c=cmp(a['年度'],b['年度']);if(Math.abs(c)!==2&&c)return c>0;return (a._k||0)>(b._k||0);}
function makeGroups(rows){
  const best=new Map(),cnt=new Map();
  for(const r of rows){const k=r['事業所No']||('?'+r['事業所名']);
    cnt.set(k,(cnt.get(k)||0)+1);
    const b=best.get(k);if(!b||newer(r,b))best.set(k,r);}
  return [...best].map(([k,r])=>{const g=Object.assign({},r);g._n=cnt.get(k);return g;});
}

async function copyText(t){

  const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(a);a.select();

  tb.addEventListener('dragover',e=>{const th=e.target.closest('th');if(!th||drag==null)return;e.preventDefault();

  tb.addEventListener('drop',e=>{
    e.preventDefault();const th=e.target.closest('th');if(!th||drag==null)return;
    const cols=S.cols[S.view],from=cols.findIndex(c=>c.key===drag);let to=cols.findIndex(c=>c.key===th.dataset.k);

function bg(r){if(r._bg)return r._bg;const s=nz((r['職種']||'')+(r['職業分類1']||'')+(r['標準職業分類1']||'')).replace(/\s+/g,'');const m=new Set();for(let i=0;i<s.length-1;i++)m.add(s.substr(i,2));return r._bg=m;}
function jac(a,b){if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++;});return n/(a.size+b.size-n);}
const clip=x=>Math.max(0,Math.min(1,x));
function simScore(a,b,F){
  let sw=0,ss=0;
  if(F.job){const ca=nz(a['標準職業1コード']),cb=nz(b['標準職業1コード']);const j=jac(bg(a),bg(b));
    let s=j;if(ca&&cb){const c=ca===cb?1:ca.slice(0,3)===cb.slice(0,3)?.7:ca.slice(0,2)===cb.slice(0,2)?.4:ca.slice(0,1)===cb.slice(0,1)?.2:0;s=.55*c+.45*j;}
    sw+=40;ss+=40*s;}
  if(F.mg){const x=a._mg,y=b._mg;sw+=25;if(x!=null&&y!=null&&Math.max(x,y)>0)ss+=25*clip(1-Math.abs(x-y)/Math.max(x,y)*2);}
  if(F.yh){const x=a._yh,y=b._yh;sw+=15;if(x!=null&&y!=null)ss+=15*clip(1-Math.abs(x-y)/30);}
  if(F.loc){sw+=20;const p=a['就業_市区町村1'],q=b['就業_市区町村1'];
    if(p&&p===q)ss+=20;else{const x=(a['就業場所住所']||'').slice(0,3),y=(b['就業場所住所']||'').slice(0,3);if(x&&x===y)ss+=8;}}
  return sw?ss/sw*100:0;
}

function runChecks(){
  const R=S.all,out=[];

  add('管理No 欠損・数値以外','管理Noが空、または数字でない',R.filter(r=>r._k==null),r=>r['求人番号']);

  add('事業所No 欠損','事業所Noが空(事業所別一覧が正しくまとまらない)',R.filter(r=>!r['事業所No']));

  add('賞与あり で基本給なし','予想賞与(基本給×2)が計算不可',R.filter(r=>bonusYes(r)&&r._kh==null));
  add('残業あり で時間数なし/過大','残業ありで平均残業時間が空、または80時間超',R.filter(r=>/あり|有/.test(r['残業の有無']||'')&&(r._ot==null||r._ot>80)));
  add('就業場所 欠損','就業場所住所と市区町村がともに空',R.filter(r=>!r['就業場所住所']&&!r._pl));
  add('求人数(計) 0','通勤+住込+不問が0または空',R.filter(r=>!r._tot));
  add('全社員数 < 就業社員数','企業全体より就業場所の人数が多い',R.filter(r=>{const a=toNum(r['全社員数']),b=toNum(r['就業社員数']);return a!=null&&b!=null&&a<b;}));

function markAc(scroll){
  const tb=$('#tb');tb.querySelectorAll('td.ac').forEach(x=>x.classList.remove('ac'));
  if(!S.ac)return;
  const tr=tb.querySelector(`tbody tr[data-i="${S.ac.i}"]`);if(!tr)return;
  const td=tr.cells[S.ac.c];if(!td)return;
  td.classList.add('ac');
  if(!scroll)return;
  const w=$('#wrap'),wr=w.getBoundingClientRect(),r=td.getBoundingClientRect();
  const th=tb.querySelector('thead th'),hh=th?th.getBoundingClientRect().height:0;
  const k0=tb.querySelector('th.k0'),kw=k0&&S.ac.c>0?k0.getBoundingClientRect().width:0;
  if(r.top<wr.top+hh)w.scrollTop-=(wr.top+hh-r.top);
  else if(r.bottom>wr.bottom)w.scrollTop+=(r.bottom-wr.bottom);
  if(r.left<wr.left+kw)w.scrollLeft-=(wr.left+kw-r.left);
  else if(r.right>wr.right)w.scrollLeft+=(r.right-wr.right);
}
function moveAc(dr,dc){
  const n=S.sorted.length,ncol=S.cols[S.view].length;if(!n)return;
  const ps=S.ps,pages=ps?Math.max(1,Math.ceil(n/ps)):1;
  let st=ps?S.page*ps:0,en=ps?Math.min(n,st+ps):n;
  let i=S.ac?S.ac.i:st,c=S.ac?S.ac.c:1;
  i+=dr;c=Math.max(1,Math.min(ncol-1,c+dc));
  let pg=S.page;
  if(i>=en){if(S.page<pages-1)pg=S.page+1;else i=en-1;}
  else if(i<st){if(S.page>0)pg=S.page-1;else i=st;}
  i=Math.max(0,Math.min(n-1,i));
  S.ac={i,c};S.sel={v:S.view,k:selKey(S.sorted[i])};
  const tb=$('#tb');
  if(pg!==S.page){S.page=pg;render();$('#wrap').scrollTop=dr<0?1e9:0;}
  else{tb.querySelectorAll('tbody tr.sa,tbody tr.sel').forEach(x=>x.classList.remove('sa','sel'));
    const tr=tb.querySelector(`tbody tr[data-i="${i}"]`);if(tr)tr.classList.add('sel');}
  markAc(true);
}
$('#wrap').addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  let dr=0,dc=0;
  switch(e.key){
    case 'ArrowDown':dr=1;break;case 'ArrowUp':dr=-1;break;
    case 'ArrowRight':dc=1;break;case 'ArrowLeft':dc=-1;break;
    case 'Enter':dr=e.shiftKey?-1:1;break;
    default:return;}
  e.preventDefault();
  if(!S.ac){ /* 最初の1回は、表示中ページの先頭行を選ぶだけ（移動はしない） */
    const i0=S.page*(S.ps||0),r0=S.sorted[i0];if(!r0)return;
    S.ac={i:i0,c:1};S.sel={v:S.view,k:selKey(r0)};
    const tb=$('#tb');tb.querySelectorAll('tbody tr.sa,tbody tr.sel').forEach(x=>x.classList.remove('sa','sel'));
    const tr0=tb.querySelector(`tbody tr[data-i="${i0}"]`);if(tr0)tr0.classList.add('sel');
    markAc(true);return;}
  moveAc(dr,dc);
});


/* ---------- 起動 ---------- */
(async function(){
  buildAdv();
  S.cols.list=LIST_DEF.map(mkCol);S.cols.group=GROUP_DEF.map(mkCol);
  try{
    const recs=parseCSV(await loadCSV());
    if(recs.length<2)throw new Error('データ行がありません');
    S.all=buildRows(recs);
    const ys=S.all.map(r=>r['年度']).filter(Boolean).sort((a,b)=>cmp(b,a));
    $('#yr').textContent=ys[0]||'-';
    $('#msg').remove();
    apply();fit();
  }catch(e){
    $('#msg').textContent='CSVを読み込めませんでした。\n'+e.message+'\n\nkyujin.html と kyujin2026.csv を同じフォルダに置くか、ネットワークを確認してください。';
  }
})();
</script>
